      body.appendChild(b);
    });
    const m = App.modal({ title: "Export " + clients.length + " " + App.T("client", true), body });
    body.querySelectorAll("button").forEach((b, i) => b.onclick = () => { m.close(); opts[i].fn(); App.toast("Exported"); });
  }

  /* ---------- Import (CSV / Excel / vCard) ---------- */

  function importChooser() {
    App.pickFileBinary(".csv,.xlsx,.vcf,text/csv,text/vcard", async (buf, filename) => {
      const ext = (filename.split(".").pop() || "").toLowerCase();
      try {
        if (ext === "xlsx") {
          const rows = await App.xlsx.parse(buf);
          mappingImportFlow(rows.map(r => r.map(v => String(v == null ? "" : v))), "Excel");
        } else if (ext === "vcf") {
          vcfImportFlow(App.vcf.parse(new TextDecoder().decode(buf)));
        } else {
          mappingImportFlow(App.csv.parse(new TextDecoder().decode(buf).replace(/^﻿/, "")), "CSV");
        }
      } catch (e) {
        App.toast(e.message || "Couldn't read that file", "error");
      }
    });
  }

  function vcfImportFlow(contacts) {
    if (!contacts.length) return App.toast("No contacts found in that file", "error");
    App.confirm("Import " + contacts.length + " contacts?",
      `Contacts from the file will be added as ${App.esc(App.T("client", true))}. Duplicates (matched by email or name) are skipped automatically.`,
      () => {
        const defaultStatus = App.cfg.clientStatuses[0].id;
        let added = 0;
        contacts.forEach(ct => {
          const dupe = App.store.data.clients.find(c =>
            (ct.email && c.email && c.email.toLowerCase() === ct.email.toLowerCase()) ||
            c.name.toLowerCase() === String(ct.name).toLowerCase());
          if (dupe) return;
          App.store.data.clients.push(Object.assign({ status: defaultStatus, source: "vCard import" }, ct,
            { id: App.uid(), createdAt: Date.now(), updatedAt: Date.now() }));
          added++;
        });
        App.store.log("upload", `Imported <b>${added}</b> ${App.T("client", true)} from vCard`);
        App.store.save();
        App.toast("Imported " + added + " (duplicates skipped)");
        App.render();
      });
  }

  /* ---------- Tabular import with column mapping ---------- */

  function mappingImportFlow(rows, sourceLabel) {
      if (rows.length < 2) return App.toast("That file needs a header row plus data", "error");
      const headers = rows[0];
      const fields = [["", "— Skip —"], ["name", "Name"], ["company", "Company"], ["email", "Email"], ["phone", "Phone"], ["status", "Status"], ["source", "Source"], ["address", "Address"], ["notes", "Notes"]];

      const guess = (h) => {
        const l = h.toLowerCase();
        if (/name/.test(l) && !/company|business/.test(l)) return "name";
        if (/company|business|organi/.test(l)) return "company";
        if (/mail/.test(l)) return "email";
        if (/phone|mobile|cell|tel/.test(l)) return "phone";
        if (/status|stage/.test(l)) return "status";
        if (/source|origin|channel/.test(l)) return "source";
        if (/address|city|street/.test(l)) return "address";
        if (/note|comment|memo/.test(l)) return "notes";
        return "";
      };

      const body = document.createElement("div");
      body.innerHTML = `
        <p style="font-size:13px;color:var(--text-2);margin-bottom:14px">
          Found <b>${rows.length - 1}</b> rows. Match your ${App.esc(sourceLabel)} columns to fields — we've guessed where we could. Duplicates are skipped automatically.</p>
        <div class="form-grid">${headers.map((h, i) => `
          <div class="field"><label>Column: “${App.esc(h)}”</label>
            <select data-col="${i}">${fields.map(([v, l]) => `<option value="${v}"${guess(h) === v ? " selected" : ""}>${l}</option>`).join("")}</select>
          </div>`).join("")}</div>`;

      App.modal({
        title: "Import " + App.T("client", true),
        body, wide: true,
        onOpen(overlay, close) {
          const foot = document.createElement("div");
          foot.style.cssText = "display:flex;justify-content:flex-end;gap:9px;padding:0 22px 20px";
          foot.innerHTML = `<button class="btn">Cancel</button><button class="btn btn-primary">Import</button>`;
          overlay.querySelector(".modal").appendChild(foot);
          foot.children[0].onclick = close;
          foot.children[1].onclick = () => {
            const map = {};
            overlay.querySelectorAll("[data-col]").forEach(sel => { if (sel.value) map[sel.dataset.col] = sel.value; });
            if (!Object.values(map).includes("name")) return App.toast("Map at least one column to Name", "error");
            let count = 0, skipped = 0;
            const defaultStatus = App.cfg.clientStatuses[0].id;
            const validStatuses = App.cfg.clientStatuses.map(s => s.id);
            rows.slice(1).forEach(r => {
              const obj = { status: defaultStatus };
              Object.entries(map).forEach(([col, field]) => { obj[field] = String(r[col] || "").trim(); });
              if (!obj.name) return;
              const dupe = App.store.data.clients.find(c =>
                (obj.email && c.email && c.email.toLowerCase() === obj.email.toLowerCase()) ||
                c.name.toLowerCase() === obj.name.toLowerCase());
              if (dupe) { skipped++; return; }
              if (obj.status && !validStatuses.includes(obj.status)) {
                const match = App.cfg.clientStatuses.find(s => s.label.toLowerCase() === String(obj.status).toLowerCase());
                obj.status = match ? match.id : defaultStatus;
              }
              App.store.data.clients.push(Object.assign(obj, { id: App.uid(), createdAt: Date.now(), updatedAt: Date.now() }));
              count++;
            });
            App.store.log("upload", `Imported <b>${count}</b> ${App.T("client", true)} from ${App.esc(sourceLabel)}`);
            App.store.save();
            close();
            App.toast(`Imported ${count}` + (skipped ? ` (${skipped} duplicates skipped)` : ""));
            App.render();
          };
        }
      });
  }

              <div class="prop"><span class="prop-k">Address</span><span class="prop-v">${App.esc(c.address || "—")}</span></div>
              <div class="prop"><span class="prop-k">Source</span><span class="prop-v">${App.esc(c.source || "—")}</span></div>
              <div class="prop"><span class="prop-k">Added</span><span class="prop-v">${App.fmtDate(new Date(c.createdAt).toISOString().slice(0, 10))}</span></div>
            </div>
            ${c.notes ? `<div class="mt-16" style="font-size:13px;line-height:1.6;color:var(--text-2);background:var(--surface-2);border-radius:10px;padding:12px 14px">${App.esc(c.notes)}</div>` : ""}
          </div>
          <div class="card card-pad">
            <div class="card-title">Upcoming</div>
            ${events.length ? events.slice(0, 4).map(e => `
              <div style="display:flex;gap:10px;padding:7px 0;font-size:13px;align-items:center">
                <span class="pill pill-accent">${App.fmtDateShort(e.date)}</span>
                <span style="font-weight:600">${App.esc(e.title)}</span>

          </div>
        </div>

        <div class="card">
          <div class="tabs" style="padding:6px 16px 0" id="cdTabs">
            <button class="tab active" data-tab="projects">${App.esc(App.TC("project", true))}<span class="tab-count">${projects.length}</span></button>
            <button class="tab" data-tab="invoices">Invoices<span class="tab-count">${invoices.length}</span></button>
            <button class="tab" data-tab="tasks">Tasks<span class="tab-count">${tasks.length}</span></button>
            <button class="tab" data-tab="notes">Notes<span class="tab-count">${notes.length}</span></button>
          </div>
          <div id="cdTabBody"></div>
        </div>
      </div>`;

    const tabBody = content.querySelector("#cdTabBody");

    const renderTab = (tab) => {
      if (tab === "projects") {
        tabBody.innerHTML = projects.length ? `<div class="table-wrap"><table class="data"><tbody>` +
          projects.map(p => {
            const stg = App.cfg.projectStages.find(s => s.id === p.stage) || App.cfg.projectStages[0];
            return `<tr class="clickable" onclick="location.hash='#/projects/${p.id}'">
              <td><div class="td-main">${App.esc(p.name)}</div><div class="td-sub">${App.fmtDate(p.startDate)}</div></td>

        tabBody.innerHTML = invoices.length ? `<div class="table-wrap"><table class="data"><tbody>` +

            <td>${App.invoiceStatusPill(i)}</td>
            <td class="num" style="font-weight:650">${App.money(App.invoiceTotal(i).total)}</td></tr>`).join("") +

      if (tab === "tasks") {
        tabBody.innerHTML = tasks.length ? tasks.map(t => `
          <div class="task-row ${t.done ? "done" : ""}">
            <div class="task-check ${t.done ? "done" : ""}" data-check="${t.id}">${App.icons.check}</div>

            <div class="task-meta">${App.duePill(t.due)}</div>
          </div>`).join("") : emptyTab("No tasks linked here.");
        tabBody.querySelectorAll("[data-check]").forEach(el => {
          el.onclick = () => {
            const t = App.store.get("tasks", el.dataset.check);
            App.store.update("tasks", t.id, { done: !t.done });
            renderDetail(content, id);
          };
        });
        addTabAction(tab, "New task", () => App.taskForm(null, { clientId: c.id }));
      }
      if (tab === "notes") {
        tabBody.innerHTML = notes.length ? notes.map(n => `
          <div class="note-list-item" onclick="location.hash='#/notes/${n.id}'">
            <div class="n-title">${App.esc(n.title || "Untitled")}</div>
            <div class="n-preview">${App.esc((n.body || "").replace(/<[^>]+>/g, " ").slice(0, 90))}</div>
          </div>`).join("") : emptyTab("No notes yet.");
        addTabAction(tab, "New note", () => {
          const n = App.store.add("notes", { title: "", body: "", clientId: c.id });
          App.nav("#/notes/" + n.id);
        });
      }
    };

    function emptyTab(msg) {
      return `<div class="card-pad"><p class="muted" style="font-size:13px">${App.esc(msg)}</p></div>`;
    }
    function addTabAction(tab, label, fn) {
      const bar = document.createElement("div");
      bar.style.cssText = "padding:10px 16px 14px";
      bar.innerHTML = `<button class="btn btn-sm">${App.icons.plus}${App.esc(label)}</button>`;
      bar.querySelector("button").onclick = fn;
      tabBody.appendChild(bar);
    }

    content.querySelectorAll("#cdTabs .tab").forEach(t => {
      t.onclick = () => {
        content.querySelectorAll("#cdTabs .tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        renderTab(t.dataset.tab);
      };
    });
    renderTab("projects");

    content.querySelector("#cdEdit").onclick = () => App.crmForm(c);
    content.querySelector("#cdNewInvoice").onclick = () => App.invoiceForm(null, { clientId: c.id });
  }

})();

/* ============================================================
   Module: Projects/Jobs — pipeline board + detail view
   ============================================================ */

"use strict";

(function () {

  let view = "board"; // board | list

  App.registerRoute("projects", function (content, route) {
    if (route.id) return renderDetail(content, route.id);
    renderIndex(content);
  });

  /* ---------- Project form ---------- */

  App.projectForm = function (existing, prefill) {
    const stages = App.cfg.projectStages;
    App.formModal({
      title: existing ? `Edit ${App.T("project")}` : `New ${App.T("project")}`,
      wide: true,
      values: existing || prefill || {},
      fields: [
        { key: "name", label: "Name", required: true, placeholder: App.cfg.projectPlaceholder || "e.g. Spring engagement" },
        { key: "clientId", label: App.TC("client"), type: "select", options: App.clientOptions() },
        { key: "stage", label: "Stage", type: "select", options: stages.map(s => [s.id, s.label]), value: existing ? existing.stage : stages[0].id },
        { key: "value", label: "Value", type: "number", step: "0.01", min: 0, placeholder: "0.00" },
        { key: "startDate", label: "Start date", type: "date", value: existing ? existing.startDate : App.todayISO() },
        { key: "dueDate", label: "Target date", type: "date" },
        { key: "description", label: "Description", type: "textarea", full: true }
      ],
      onSubmit(values, close) {
        if (existing) {
          App.store.update("projects", existing.id, values);
          App.toast(App.TC("project") + " updated");
        } else {
          const p = App.store.add("projects", values);
          App.store.log("projects", `Created ${App.T("project")} <b>${App.esc(p.name)}</b>`);
          App.store.save();
          App.toast(App.TC("project") + " created");
        }
        close();
        App.render();
      }
    });
  };

  /* ---------- Index (board / list) ---------- */

  function renderIndex(content) {
    const stages = App.cfg.projectStages;
    const projects = App.store.all("projects");

    content.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">${App.esc(App.TC("project", true))}</div>
          <div class="page-desc">Drag cards between stages to move work forward.</div>
        </div>
        <div class="spacer"></div>
        <div class="page-actions">
          <div class="seg">
            <button data-v="board" class="${view === "board" ? "active" : ""}">Board</button>
            <button data-v="list" class="${view === "list" ? "active" : ""}">List</button>
          </div>
          <button class="btn btn-primary" id="projNew">${App.icons.plus} New ${App.esc(App.T("project"))}</button>
        </div>
      </div>
      <div id="projBody"></div>`;

    content.querySelectorAll(".seg button").forEach(b => b.onclick = () => { view = b.dataset.v; renderIndex(content); });
    content.querySelector("#projNew").onclick = () => App.projectForm();

    const body = content.querySelector("#projBody");

    if (!projects.length) {
      const card = document.createElement("div");
      card.className = "card";
      card.appendChild(App.emptyState("projects", "No " + App.T("project", true) + " yet",
        "Track every " + App.T("project") + " from first contact to done — value, stage, dates, and everything linked to it.",
        "Create " + App.T("project"), () => App.projectForm()));
      body.appendChild(card);
      return;
    }

    if (view === "board") renderBoard(body, stages, projects);
    else renderListView(body, stages, projects);
  }

  function renderBoard(body, stages, projects) {
    const board = document.createElement("div");
    board.className = "board";
    stages.forEach(st => {
      const cards = projects.filter(p => p.stage === st.id).sort((a, b) => b.updatedAt - a.updatedAt);
      const total = cards.reduce((s, p) => s + (Number(p.value) || 0), 0);
      const col = document.createElement("div");
      col.className = "board-col";
      col.dataset.stage = st.id;
      col.innerHTML = `
        <div class="board-col-head">
          <span class="col-dot" style="background:var(--${st.color})"></span>
          ${App.esc(st.label)} <span class="count">${cards.length}</span>
          <span class="col-total">${total ? App.moneyShort(total) : ""}</span>
        </div>
        <div class="board-cards">${cards.map(p => {
          const client = App.rel.clientName(p.clientId);
          const openTasks = App.rel.tasksOf({ projectId: p.id }).filter(t => !t.done).length;
          return `<div class="board-card" draggable="true" data-id="${p.id}">
            <div class="bc-title">${App.esc(p.name)}</div>
            ${client ? `<div class="bc-sub">${App.avatarHTML(client).replace('class="avatar ', 'class="avatar " style="width:18px;height:18px;font-size:8px;')} ${App.esc(client)}</div>` : ""}
            <div class="bc-foot">
              ${p.dueDate ? App.duePill(p.dueDate) : ""}
              ${openTasks ? `<span class="pill pill-slate">${openTasks} task${openTasks === 1 ? "" : "s"}</span>` : ""}
              <span class="bc-value">${p.value ? App.moneyShort(p.value) : ""}</span>
            </div>
          </div>`;
        }).join("")}</div>`;
      board.appendChild(col);
    });
    body.appendChild(board);

    // Click to open
    board.querySelectorAll(".board-card").forEach(card => {
      card.addEventListener("click", () => App.nav("#/projects/" + card.dataset.id));
      card.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", card.dataset.id);
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", () => card.classList.remove("dragging"));
    });

    // Drop targets
    board.querySelectorAll(".board-col").forEach(col => {
      col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("drag-over"); });
      col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
      col.addEventListener("drop", (e) => {
        e.preventDefault();
        col.classList.remove("drag-over");
        const id = e.dataTransfer.getData("text/plain");
        const p = App.store.get("projects", id);
        if (!p || p.stage === col.dataset.stage) return;
        const st = stages.find(s => s.id === col.dataset.stage);
        App.store.update("projects", id, { stage: col.dataset.stage });
        App.store.log("projects", `Moved <b>${App.esc(p.name)}</b> to <b>${App.esc(st.label)}</b>`);
        App.store.save();
        App.toast(`Moved to ${st.label}`);
        if (st.id === stages[stages.length - 1].id)
          App.webhook("project.completed", { name: p.name, client: App.rel.clientName(p.clientId), value: p.value || 0 });
        // If moved to final stage, offer a follow-up task (modules talking to each other)
        if (st.id === stages[stages.length - 1].id && p.clientId) {
          const client = App.rel.clientName(p.clientId);
          setTimeout(() => App.confirm("Nice — " + App.T("project") + " complete! 🎉",
            `Want a follow-up task to check in with <b>${App.esc(client)}</b> in a week? Repeat business starts with a follow-up.`,
            () => {
              App.store.add("tasks", { title: "Follow up with " + client + " re: " + p.name, due: App.addDaysISO(App.todayISO(), 7), clientId: p.clientId, projectId: p.id, priority: "normal", done: false });
              App.toast("Follow-up task created");
              App.render();
            }), 350);
        }
        App.render();
      });
    });
  }

  function renderListView(body, stages, projects) {
    const card = document.createElement("div");
    card.className = "card";
    const sorted = projects.slice().sort((a, b) => b.updatedAt - a.updatedAt);
    card.innerHTML = `<div class="table-wrap"><table class="data">
      <thead><tr><th>Name</th><th>${App.esc(App.TC("client"))}</th><th>Stage</th><th>Target</th><th class="num">Value</th><th></th></tr></thead>
      <tbody>${sorted.map(p => {
        const st = stages.find(s => s.id === p.stage) || stages[0];
        return `<tr class="clickable" data-id="${p.id}">
          <td class="td-main">${App.esc(p.name)}</td>
          <td>${App.esc(App.rel.clientName(p.clientId) || "—")}</td>
          <td>${App.pill(st.label, st.color)}</td>
          <td>${p.dueDate ? App.duePill(p.dueDate) : '<span class="muted">—</span>'}</td>

    const invoiced = invoices.reduce((s, i) => s + App.invoiceTotal(i).total, 0);

        <div class="detail-meta">

            ${p.startDate ? `<span>Started ${App.fmtDate(p.startDate)}</span>` : ""}

          </div>
        </div>
        <div class="page-actions">

          <button class="btn btn-primary" id="pdInvoice">${App.icons.plus} Invoice</button>

      </div>

      <div class="card card-pad mb-16">
        <div class="card-title">Stage
          <span class="spacer"></span>
          <select id="pdStage" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer">
            ${stages.map(s => `<option value="${s.id}"${s.id === st.id ? " selected" : ""}>${App.esc(s.label)}</option>`).join("")}
          </select>
        </div>
        ${App.charts.progress((stageIdx + 1) / stages.length * 100)}
        <div style="display:flex;justify-content:space-between;margin-top:8px">
          ${stages.map((s, i) => `<span style="font-size:10.5px;font-weight:${i === stageIdx ? 700 : 500};color:${i <= stageIdx ? "var(--accent)" : "var(--text-3)"}">${App.esc(s.label)}</span>`).join("")}
        </div>

        <div class="kpi" style="--kpi-color:var(--amber)"><div class="kpi-label">Invoiced</div><div class="kpi-value" style="font-size:21px">${App.money(invoiced)}</div></div>
        <div class="kpi" style="--kpi-color:var(--green)"><div class="kpi-label">Collected</div><div class="kpi-value" style="font-size:21px">${App.money(collected)}</div></div>
        <div class="kpi" style="--kpi-color:var(--purple)"><div class="kpi-label">Tasks open</div><div class="kpi-value" style="font-size:21px">${tasks.filter(t => !t.done).length}<span class="muted" style="font-size:13px;font-weight:500"> / ${tasks.length}</span></div></div>
      </div>

      ${p.description ? `<div class="card card-pad mt-16"><div class="card-title">Description</div><p style="font-size:13.5px;line-height:1.65;color:var(--text-2)">${App.esc(p.description)}</p></div>` : ""}

      <div class="grid-2 mt-16">
        <div class="card">
          <div class="card-title" style="padding:18px 22px 0">Tasks
            <span class="spacer"></span>

          </div>
          <div id="pdTasks" class="mt-8"></div>
        </div>
        <div class="stack">
          <div class="card">
            <div class="card-title" style="padding:18px 22px 0">Time
              <span class="spacer"></span>
              <button class="btn btn-ghost btn-sm" id="pdTimeAdd">${App.icons.plus} Log time</button>
              <button class="btn btn-sm ${App.store.data.settings.activeTimer && App.store.data.settings.activeTimer.projectId === p.id ? "btn-danger" : "btn-primary"}" id="pdTimer">
                ${App.store.data.settings.activeTimer && App.store.data.settings.activeTimer.projectId === p.id ? "■ Stop timer" : "▶ Start timer"}
              </button>
            </div>
            <div id="pdTime"></div>
          </div>
          <div class="card">
            <div class="card-title" style="padding:18px 22px 0">Invoices</div>
            <div id="pdInvoices"></div>
          </div>
          <div class="card">
            <div class="card-title" style="padding:18px 22px 0">Notes
              <span class="spacer"></span>
              <button class="btn btn-ghost btn-sm" id="pdNewNote">${App.icons.plus} Add</button>
            </div>
            <div id="pdNotes"></div>
          </div>
        </div>
      </div>`;

    content.querySelector("#pdStage").onchange = (e) => {
      App.store.update("projects", id, { stage: e.target.value });
      const s = stages.find(x => x.id === e.target.value);
      App.store.log("projects", `Moved <b>${App.esc(p.name)}</b> to <b>${App.esc(s.label)}</b>`);
      App.store.save();
      renderDetail(content, id);
    };

    const tEl = content.querySelector("#pdTasks");
    tEl.innerHTML = tasks.length ? tasks.sort((a, b) => (a.done - b.done) || String(a.due || "9999").localeCompare(String(b.due || "9999"))).map(t => `
      <div class="task-row ${t.done ? "done" : ""}">
        <div class="task-check ${t.done ? "done" : ""}" data-check="${t.id}">${App.icons.check}</div>
        <div class="task-title">${App.esc(t.title)}</div>

      </div>`).join("") : `<div class="card-pad"><p class="muted" style="font-size:13px">Break this ${App.esc(App.T("project"))} into steps.</p></div>`;
    tEl.querySelectorAll("[data-check]").forEach(el => el.onclick = () => {
      const t = App.store.get("tasks", el.dataset.check);
      App.store.update("tasks", t.id, { done: !t.done });
      renderDetail(content, id);
    });

    // Time card
    const logs = App.store.all("timelogs").filter(l => l.projectId === p.id && l.endTs)
      .sort((a, b) => b.startTs - a.startTs);
    const totalH = Math.round(logs.reduce((s, l) => s + (l.endTs - l.startTs), 0) / 36000) / 100;
    const unbilledH = Math.round(logs.filter(l => !l.billed).reduce((s, l) => s + (l.endTs - l.startTs), 0) / 36000) / 100;
    const tmEl = content.querySelector("#pdTime");
    tmEl.innerHTML = logs.length
      ? `<div class="card-pad" style="padding-top:8px;padding-bottom:10px">
          <div class="muted" style="font-size:12px;margin-bottom:8px">${totalH}h total · <b style="color:var(--text)">${unbilledH}h unbilled</b>${unbilledH ? " — add it from any invoice editor" : ""}</div>
          ${logs.slice(0, 5).map(l => `
            <div style="display:flex;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border);align-items:center">
              <span style="flex:1">${App.esc(l.desc || "Time")}</span>
              <span class="muted">${App.fmtDateShort(new Date(l.startTs).toISOString().slice(0, 10))}</span>
              <b style="font-variant-numeric:tabular-nums">${(Math.round((l.endTs - l.startTs) / 36000) / 100)}h</b>
              ${l.billed ? App.pill("billed", "green") : ""}
            </div>`).join("")}
        </div>`
      : `<div class="card-pad" style="padding-top:6px"><p class="muted" style="font-size:13px">Track billable hours — they flow straight into invoices.</p></div>`;

    content.querySelector("#pdTimer").onclick = () => {
      const s = App.store.data.settings;
      if (s.activeTimer && s.activeTimer.projectId === p.id) {
        // stop
        App.store.add("timelogs", {
          projectId: p.id, clientId: p.clientId,
          desc: s.activeTimer.desc || "Work on " + p.name,
          startTs: s.activeTimer.startTs, endTs: Date.now(), billed: false
        });
        s.activeTimer = null;
        App.store.save();
        App.toast("Time logged");
        renderDetail(content, id);
      } else if (s.activeTimer) {
        App.toast("Another timer is running — stop it first (top bar)", "error");
      } else {
        App.formModal({
          title: "Start timer",
          fields: [{ key: "desc", label: "What are you working on?", full: true, placeholder: "e.g. Drafting, prep, on-site work…" }],
          onSubmit(v, close) {
            s.activeTimer = { projectId: p.id, clientId: p.clientId, desc: v.desc, startTs: Date.now() };
            App.store.save();
            close();
            App.toast("Timer running — stop it here or in the top bar");
            renderDetail(content, id);

        });

    content.querySelector("#pdTimeAdd").onclick = () => {
      App.formModal({

          { key: "desc", label: "Description", full: true, placeholder: "e.g. Site visit" },
          { key: "hours", label: "Hours", type: "number", step: "0.25", min: 0, required: true, value: 1 },
          { key: "date", label: "Date", type: "date", value: App.todayISO() }
        ],
        onSubmit(v, close) {
          const start = new Date((v.date || App.todayISO()) + "T09:00:00").getTime();
          App.store.add("timelogs", {
            projectId: p.id, clientId: p.clientId, desc: v.desc || "Time",
            startTs: start, endTs: start + Math.round((Number(v.hours) || 0) * 3600000), billed: false
          });
          close();
          App.toast("Time logged");
          renderDetail(content, id);

      });

    const iEl = content.querySelector("#pdInvoices");
    iEl.innerHTML = invoices.length ? `<div class="table-wrap"><table class="data"><tbody>` +
      invoices.map(i => `<tr class="clickable" onclick="location.hash='#/invoices/${i.id}'">
        <td class="td-main">#${App.esc(i.number)}</td>
        <td>${App.invoiceStatusPill(i)}</td>
        <td class="num" style="font-weight:650">${App.money(App.invoiceTotal(i).total)}</td></tr>`).join("") +
      `</tbody></table></div>` : `<div class="card-pad"><p class="muted" style="font-size:13px">Nothing invoiced yet.</p></div>`;

    const nEl = content.querySelector("#pdNotes");
    nEl.innerHTML = notes.length ? notes.map(n => `
      <div class="note-list-item" onclick="location.hash='#/notes/${n.id}'">
        <div class="n-title">${App.esc(n.title || "Untitled")}</div>
        <div class="n-preview">${App.esc((n.body || "").replace(/<[^>]+>/g, " ").slice(0, 80))}</div>
      </div>`).join("") : `<div class="card-pad"><p class="muted" style="font-size:13px">No notes yet.</p></div>`;

    content.querySelector("#pdEdit").onclick = () => App.projectForm(p);
    content.querySelector("#pdInvoice").onclick = () => App.invoiceForm(null, { clientId: p.clientId, projectId: p.id });
    content.querySelector("#pdNewTask").onclick = () => App.taskForm(null, { projectId: p.id, clientId: p.clientId });
    content.querySelector("#pdNewNote").onclick = () => {
      const n = App.store.add("notes", { title: "", body: "", projectId: p.id, clientId: p.clientId });
      App.nav("#/notes/" + n.id);
    };
  }

})();

   Module: Tasks — smart list with filters and priorities

"use strict";

(function () {

  let filter = { show: "open", q: "" };

  App.registerRoute("tasks", function (content) {
    render(content);
  });

  App.taskForm = function (existing, prefill) {
    App.formModal({
      title: existing ? "Edit task" : "New task",
      values: existing || prefill || {},
      fields: [
        { key: "title", label: "What needs doing?", required: true, full: true, placeholder: "e.g. Send the quote, order materials…" },
        { key: "due", label: "Due date", type: "date" },
        { key: "priority", label: "Priority", type: "select", options: [["normal", "Normal"], ["high", "High"], ["low", "Low"]], value: existing ? existing.priority : "normal" },
        { key: "clientId", label: App.TC("client"), type: "select", options: App.clientOptions() },
        { key: "projectId", label: App.TC("project"), type: "select", options: App.projectOptions() },
        { key: "notes", label: "Details", type: "textarea", full: true }
      ],
      onSubmit(values, close) {
        if (existing) {
          App.store.update("tasks", existing.id, values);
          App.toast("Task updated");
        } else {
          values.done = false;
          const t = App.store.add("tasks", values);
          App.store.log("tasks", `Added task <b>${App.esc(t.title)}</b>`);
          App.store.save();
          App.toast("Task added");
        }
        close();
        App.render();
      }
    });
  };

  function render(content) {
    let tasks = App.store.all("tasks").slice();
    const openCount = tasks.filter(t => !t.done).length;
    const doneCount = tasks.length - openCount;

    if (filter.q) {
      const q = filter.q.toLowerCase();
      tasks = tasks.filter(t => (t.title + " " + (t.notes || "")).toLowerCase().includes(q));
    }
    if (filter.show === "open") tasks = tasks.filter(t => !t.done);
    if (filter.show === "done") tasks = tasks.filter(t => t.done);

    const prioRank = { high: 0, normal: 1, low: 2 };
    tasks.sort((a, b) => (a.done - b.done)
      || String(a.due || "9999").localeCompare(String(b.due || "9999"))
      || (prioRank[a.priority] || 1) - (prioRank[b.priority] || 1));

    const today = App.todayISO();
    const groups = [
      { label: "Overdue", items: tasks.filter(t => !t.done && t.due && t.due < today) },
      { label: "Today", items: tasks.filter(t => !t.done && t.due === today) },
      { label: "Upcoming", items: tasks.filter(t => !t.done && (!t.due || t.due > today)) },
      { label: "Completed", items: tasks.filter(t => t.done) }
    ].filter(g => g.items.length);

    content.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">Tasks</div>
          <div class="page-desc">${openCount} open · ${doneCount} completed</div>
        </div>
        <div class="spacer"></div>
        <div class="page-actions">
          <button class="btn btn-primary" id="taskNew">${App.icons.plus} New task</button>
        </div>
      </div>

      <div class="filter-bar">
        <div class="seg">
          <button data-s="open" class="${filter.show === "open" ? "active" : ""}">Open</button>
          <button data-s="done" class="${filter.show === "done" ? "active" : ""}">Done</button>
          <button data-s="all" class="${filter.show === "all" ? "active" : ""}">All</button>
        </div>
        <input type="text" id="taskSearch" placeholder="Search tasks…" value="${App.esc(filter.q)}">
      </div>

      <div id="taskBody" class="stack"></div>`;

    content.querySelector("#taskNew").onclick = () => App.taskForm();
    content.querySelectorAll(".seg button").forEach(b => b.onclick = () => { filter.show = b.dataset.s; render(content); });
    content.querySelector("#taskSearch").oninput = App.debounce(e => {
      filter.q = e.target.value; render(content);
      const el = content.querySelector("#taskSearch");
      el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    }, 200);

    const body = content.querySelector("#taskBody");

    if (!groups.length) {
      const card = document.createElement("div");
      card.className = "card";
      card.appendChild(App.emptyState("tasks",
        App.store.all("tasks").length ? "Nothing here" : "No tasks yet",
        App.store.all("tasks").length ? "Try a different filter." : "Capture everything you need to do — link tasks to " + App.T("client", true) + " and " + App.T("project", true) + " so nothing slips.",
        "Add a task", () => App.taskForm()));
      body.appendChild(card);
      return;
    }

    groups.forEach(g => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<div class="card-title" style="padding:16px 22px 0">${g.label}
          <span class="muted" style="font-weight:500;font-size:12px">${g.items.length}</span></div>` +
        g.items.map(t => `
          <div class="task-row ${t.done ? "done" : ""}">
            <div class="task-check ${t.done ? "done" : ""}" data-check="${t.id}">${App.icons.check}</div>
            <div>
              <div class="task-title" data-open="${t.id}">${App.esc(t.title)}
                ${t.priority === "high" ? App.pill("High", "red") : ""}${t.priority === "low" ? App.pill("Low", "slate") : ""}
              </div>
              ${App.linkChips(t) ? `<div class="td-sub task-link">${App.linkChips(t)}</div>` : ""}
            </div>
            <div class="task-meta">
              ${App.duePill(t.due)}
              <button class="icon-btn" data-edit="${t.id}">${App.icons.edit}</button>
              <button class="icon-btn" data-del="${t.id}">${App.icons.trash}</button>
            </div>
          </div>`).join("");
      body.appendChild(card);
    });

    body.querySelectorAll("[data-check]").forEach(el => el.onclick = () => {
      const t = App.store.get("tasks", el.dataset.check);
      App.store.update("tasks", t.id, { done: !t.done });
      if (t.done) App.store.log("check", `Completed task <b>${App.esc(t.title)}</b>`);
      App.store.save();
      render(content);
    });
    body.querySelectorAll("[data-open]").forEach(el => el.onclick = () => App.taskForm(App.store.get("tasks", el.dataset.open)));
    body.querySelectorAll("[data-edit]").forEach(el => el.onclick = () => App.taskForm(App.store.get("tasks", el.dataset.edit)));
    body.querySelectorAll("[data-del]").forEach(el => el.onclick = () => {
      const t = App.store.get("tasks", el.dataset.del);
      App.confirm("Delete task?", `<b>${App.esc(t.title)}</b> will be removed.`, () => {
        App.store.remove("tasks", t.id);
        App.toast("Task deleted");
        render(content);
      }, true);
    });
  }

})();

        ${unbilledTimeButton(inv)}

        <div style="margin:18px 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-3)">Line items</div>
        <div id="invItems">${inv.items.map((it, i) => itemRow(it, i)).join("")}</div>
        <button class="btn btn-sm" id="invAddItem" style="margin-top:8px">${App.icons.plus} Add line</button>

        <div style="display:flex;justify-content:flex-end;margin-top:16px">
          <div style="width:250px">
            <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span class="muted">Subtotal</span><b>${App.money(totals.sub)}</b></div>
            <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;align-items:center">
              <span class="muted">Tax %</span>
              <input data-k="taxRate" type="number" step="0.01" min="0" value="${inv.taxRate || 0}" style="width:80px;text-align:right;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:4px 8px">
            </div>
            <div style="display:flex;justify-content:space-between;font-size:15px;padding:8px 0;border-top:2px solid var(--border);margin-top:4px"><b>Total</b><b>${App.money(totals.total)}</b></div>
          </div>
        </div>

        <div class="field" style="margin-top:8px"><label>Notes / payment terms</label>
          <textarea data-k="notes" placeholder="e.g. Payment due within 14 days. Thank you!">${App.esc(inv.notes || "")}</textarea></div>`;

      body.querySelectorAll("[data-k]").forEach(el => {
        el.onchange = () => {
          let v = el.value;
          if (el.dataset.k === "taxRate") v = Number(v) || 0;
          inv[el.dataset.k] = v;
          if (el.dataset.k === "taxRate") draw();
          if (el.dataset.k === "clientId" || el.dataset.k === "projectId") draw();
        };
      });
      const utBtn = body.querySelector("#invUnbilledTime");
      if (utBtn) utBtn.onclick = () => {
        const logs = unbilledLogs(inv);
        const rate = App.store.data.settings.hourlyRate || 100;
        logs.forEach(l => {
          const hours = Math.round((l.endTs - l.startTs) / 36000) / 100;
          inv.items.push({ desc: (l.desc || "Time") + " (" + App.fmtDateShort(new Date(l.startTs).toISOString().slice(0, 10)) + ")", qty: hours, rate: l.rate || rate });
        });
        inv._pendingLogIds = (inv._pendingLogIds || []).concat(logs.map(l => l.id));
        inv.items = inv.items.filter(it => it.desc || it.rate);
        draw();
      };
      body.querySelectorAll("[data-item]").forEach(el => {
        el.onchange = () => {
          const [idx, key] = el.dataset.item.split(":");
          inv.items[Number(idx)][key] = key === "desc" ? el.value : (el.value === "" ? "" : Number(el.value));
          draw();
        };
      });
      body.querySelectorAll("[data-rm]").forEach(el => {
        el.onclick = () => { inv.items.splice(Number(el.dataset.rm), 1); if (!inv.items.length) inv.items.push({ desc: "", qty: 1, rate: "" }); draw(); };
      });
      body.querySelector("#invAddItem").onclick = () => { inv.items.push({ desc: "", qty: 1, rate: "" }); draw(); };
    }

    function itemRow(it, i) {
      return `<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
        <input data-item="${i}:desc" placeholder="Description" value="${App.esc(it.desc)}" style="flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13px">
        <input data-item="${i}:qty" type="number" step="0.01" min="0" placeholder="Qty" value="${it.qty}" style="width:74px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;text-align:right">
        <input data-item="${i}:rate" type="number" step="0.01" min="0" placeholder="Rate" value="${it.rate}" style="width:100px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;text-align:right">
        <div style="width:88px;text-align:right;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums">${App.money((Number(it.qty) || 0) * (Number(it.rate) || 0))}</div>
        <button class="icon-btn" data-rm="${i}" title="Remove">${App.icons.x}</button>
      </div>`;
    }

    draw();

    App.modal({
      title: existing ? "Edit invoice #" + existing.number : "New invoice",
      body, wide: true,
      onOpen(overlay, close) {
        const foot = document.createElement("div");
        foot.style.cssText = "display:flex;justify-content:flex-end;gap:9px;padding:0 22px 20px";
        foot.innerHTML = `<button class="btn">Cancel</button><button class="btn btn-primary">${existing ? "Save changes" : "Create invoice"}</button>`;
        overlay.querySelector(".modal").appendChild(foot);
        foot.children[0].onclick = close;
        foot.children[1].onclick = () => {
          inv.items = inv.items.filter(it => it.desc || it.rate);
          if (!inv.items.length) return App.toast("Add at least one line item", "error");
          if (inv.status === "paid" && !inv.paidDate) inv.paidDate = App.todayISO();
          if (inv.status !== "paid") inv.paidDate = null;
          if (inv.recurring && !inv.recurringNext) inv.recurringNext = App.advanceRecurring(inv.issueDate, inv.recurring);
          if (!inv.recurring) inv.recurringNext = null;
          // mark pulled-in time logs as billed
          const pending = inv._pendingLogIds || [];
          delete inv._pendingLogIds;
          pending.forEach(id => {
            const l = App.store.get("timelogs", id);
            if (l) l.billed = true;
          });
          if (existing) {
            App.store.update("invoices", existing.id, inv);
            App.toast("Invoice updated");
          } else {
            S.data.settings.invoiceCounter += 1;
            const saved = App.store.add("invoices", inv);
            const cname = App.rel.clientName(saved.clientId);
            App.store.log("invoices", `Created invoice <b>#${App.esc(saved.number)}</b>${cname ? " for <b>" + App.esc(cname) + "</b>" : ""} — ${App.money(App.invoiceTotal(saved).total)}`);
            App.store.save();
            App.toast("Invoice #" + saved.number + " created");
          }
          close();
          App.render();
        };
      }
    });
  };

  /* ---------- Mark paid helper (used from list + detail) ---------- */

  function markPaid(inv) {
    App.store.update("invoices", inv.id, { status: "paid", paidDate: App.todayISO() });
    const cname = App.rel.clientName(inv.clientId);
    App.store.log("money", `Invoice <b>#${App.esc(inv.number)}</b> paid${cname ? " by <b>" + App.esc(cname) + "</b>" : ""} — ${App.money(App.invoiceTotal(inv).total)}`);
    App.store.save();
    App.webhook("invoice.paid", { number: inv.number, client: cname || "", total: App.invoiceTotal(inv).total });
    App.toast("Marked paid — nice! 💰");
    App.render();
  }

  /* ---------- List ---------- */

  function renderList(content) {
    let list = App.store.all("invoices").slice();
    const today = App.todayISO();

    const totals = {
      draft: list.filter(i => i.status === "draft"),
      sent: list.filter(i => i.status === "sent" && !(i.dueDate && i.dueDate < today)),
      overdue: list.filter(i => i.status === "sent" && i.dueDate && i.dueDate < today),
      paid: list.filter(i => i.status === "paid")
    };
    const sum = arr => arr.reduce((s, i) => s + App.invoiceTotal(i).total, 0);

    if (filter.q) {
      const q = filter.q.toLowerCase();
      list = list.filter(i => (i.number + " " + (App.rel.clientName(i.clientId) || "")).toLowerCase().includes(q));
    }
    if (filter.status !== "all") {
      if (filter.status === "overdue") list = list.filter(i => i.status === "sent" && i.dueDate && i.dueDate < today);
      else list = list.filter(i => i.status === filter.status);
    }
    list.sort((a, b) => (b.issueDate || "").localeCompare(a.issueDate || "") || b.createdAt - a.createdAt);

    content.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">Invoices</div>
          <div class="page-desc">Create, send, and track every dollar owed to you.</div>
        </div>
        <div class="spacer"></div>
        <div class="page-actions">
          <button class="btn" id="invExport">${App.icons.download} Export</button>
          <button class="btn btn-primary" id="invNew">${App.icons.plus} New invoice</button>
        </div>
      </div>

      <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
        <div class="kpi" style="--kpi-color:var(--slate)"><div class="kpi-label">Draft</div><div class="kpi-value" style="font-size:20px">${App.money(sum(totals.draft))}</div><div class="kpi-sub">${totals.draft.length} invoice${totals.draft.length === 1 ? "" : "s"}</div></div>
        <div class="kpi" style="--kpi-color:var(--blue)"><div class="kpi-label">Awaiting payment</div><div class="kpi-value" style="font-size:20px">${App.money(sum(totals.sent))}</div><div class="kpi-sub">${totals.sent.length} sent</div></div>
        <div class="kpi" style="--kpi-color:var(--red)"><div class="kpi-label">Overdue</div><div class="kpi-value" style="font-size:20px">${App.money(sum(totals.overdue))}</div><div class="kpi-sub">${totals.overdue.length} need chasing</div></div>
        <div class="kpi" style="--kpi-color:var(--green)"><div class="kpi-label">Collected (all time)</div><div class="kpi-value" style="font-size:20px">${App.money(sum(totals.paid))}</div><div class="kpi-sub">${totals.paid.length} paid</div></div>
      </div>

      <div class="filter-bar mt-16">
        <div class="seg">
          ${[["all", "All"], ["draft", "Draft"], ["sent", "Sent"], ["overdue", "Overdue"], ["paid", "Paid"]].map(([v, l]) =>
            `<button data-s="${v}" class="${filter.status === v ? "active" : ""}">${l}</button>`).join("")}
        </div>
        <input type="text" id="invSearch" placeholder="Search by # or ${App.esc(App.T("client"))}…" value="${App.esc(filter.q)}">
      </div>

      <div class="card" id="invTable"></div>`;

    content.querySelector("#invNew").onclick = () => App.invoiceForm();
    content.querySelectorAll(".seg button").forEach(b => b.onclick = () => { filter.status = b.dataset.s; renderList(content); });
    content.querySelector("#invSearch").oninput = App.debounce(e => {
      filter.q = e.target.value; renderList(content);
      const el = content.querySelector("#invSearch"); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    }, 200);

    content.querySelector("#invExport").onclick = () => {
      const rows = App.store.all("invoices");
      if (!rows.length) return App.toast("Nothing to export yet", "error");
      const body = document.createElement("div");
      body.style.cssText = "display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px";
      const opts = [
        { label: "Excel (.xlsx)", hint: "Full detail workbook", fn: () => {
            App.xlsx.download("invoices.xlsx", [{
              name: "Invoices",
              rows: [["Invoice #", App.TC("client"), "Issued", "Due", "Status", "Paid date", "Subtotal", "Tax", "Total"],
                ...rows.map(i => { const t = App.invoiceTotal(i); return [i.number, App.rel.clientName(i.clientId) || "", i.issueDate || "", i.dueDate || "", i.status, i.paidDate || "", Number(t.sub.toFixed(2)), Number(t.tax.toFixed(2)), Number(t.total.toFixed(2))]; })]
            }]);
          } },
        { label: "CSV", hint: "Universal spreadsheet", fn: () => {
            App.csv.download("invoices.csv", App.csv.toCSV(rows, [
              { key: "number", label: "Invoice #" },
              { label: "Client", get: i => App.rel.clientName(i.clientId) || "" },
              { key: "issueDate", label: "Issued" }, { key: "dueDate", label: "Due" },
              { key: "status", label: "Status" }, { key: "paidDate", label: "Paid date" },
              { label: "Total", get: i => App.invoiceTotal(i).total.toFixed(2) }
            ]));
          } },
        { label: "QuickBooks", hint: "Ready for QBO import", fn: () => {
            // one row per line item, columns matching QuickBooks Online invoice import
            const lines = [];
            rows.forEach(i => {
              (i.items || []).forEach(it => lines.push({
                num: i.number, cust: App.rel.clientName(i.clientId) || "Unknown",
                inv: i.issueDate || "", due: i.dueDate || "",
                desc: it.desc, qty: Number(it.qty) || 0, rate: Number(it.rate) || 0,
                amt: ((Number(it.qty) || 0) * (Number(it.rate) || 0)).toFixed(2)
              }));
            });
            App.csv.download("invoices-quickbooks.csv", App.csv.toCSV(lines, [
              { key: "num", label: "InvoiceNo" }, { key: "cust", label: "Customer" },
              { key: "inv", label: "InvoiceDate" }, { key: "due", label: "DueDate" },
              { key: "desc", label: "ItemDescription" }, { key: "qty", label: "ItemQuantity" },
              { key: "rate", label: "ItemRate" }, { key: "amt", label: "ItemAmount" }
            ]));
          } }
      ];
      opts.forEach(o => {
        const b = document.createElement("button");
        b.className = "btn";
        b.style.cssText = "flex-direction:column;padding:16px 10px;gap:5px";
        b.innerHTML = `<span style="font-weight:700">${o.label}</span><span class="muted" style="font-size:11px;font-weight:500">${o.hint}</span>`;
        body.appendChild(b);
      });
      const m = App.modal({ title: "Export " + rows.length + " invoices", body });
      body.querySelectorAll("button").forEach((b, i) => b.onclick = () => { m.close(); opts[i].fn(); App.toast("Exported"); });
    };

    const card = content.querySelector("#invTable");
    if (!list.length) {
      card.appendChild(App.emptyState("invoices",
        App.store.all("invoices").length ? "No matches" : "No invoices yet",
        App.store.all("invoices").length ? "Try a different filter." : "Create a professional invoice in under a minute — then print it or save as PDF.",
        "Create invoice", () => App.invoiceForm()));
      return;
    }

    card.innerHTML = `<div class="table-wrap"><table class="data">
      <thead><tr><th>#</th><th>${App.esc(App.TC("client"))}</th><th>Issued</th><th>Due</th><th>Status</th><th class="num">Total</th><th></th></tr></thead>
      <tbody>${list.map(i => `
        <tr class="clickable" data-id="${i.id}">
          <td class="td-main">#${App.esc(i.number)}</td>
          <td>${App.esc(App.rel.clientName(i.clientId) || "—")}</td>
          <td>${App.fmtDateShort(i.issueDate)}</td>
          <td>${App.fmtDateShort(i.dueDate)}</td>
          <td>${App.invoiceStatusPill(i)}</td>
          <td class="num" style="font-weight:680">${App.money(App.invoiceTotal(i).total)}</td>
          <td><div class="td-actions">
            ${i.status !== "paid" ? `<button class="btn btn-sm" data-paid="${i.id}">Mark paid</button>` : ""}
            <button class="icon-btn" data-edit="${i.id}">${App.icons.edit}</button>
            <button class="icon-btn" data-del="${i.id}">${App.icons.trash}</button>
          </div></td>
        </tr>`).join("")}</tbody></table></div>`;

    card.querySelectorAll("tr.clickable").forEach(tr => tr.onclick = (e) => {
      if (e.target.closest("button")) return;
      App.nav("#/invoices/" + tr.dataset.id);
    });
    card.querySelectorAll("[data-paid]").forEach(b => b.onclick = () => markPaid(App.store.get("invoices", b.dataset.paid)));
    card.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => App.invoiceForm(App.store.get("invoices", b.dataset.edit)));
    card.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      const i = App.store.get("invoices", b.dataset.del);
      App.confirm("Delete invoice?", `Invoice <b>#${App.esc(i.number)}</b> will be permanently removed.`, () => {
        App.store.remove("invoices", i.id);
        App.toast("Invoice deleted");
        renderList(content);
      }, true);
    });
  }

  /* ---------- Detail / printable document ---------- */

  function renderDetail(content, id) {
    const inv = App.store.get("invoices", id);
    if (!inv) { content.innerHTML = `<div class="empty"><h3>Not found</h3></div>`; return; }
    const client = App.store.get("clients", inv.clientId);
    const project = App.store.get("projects", inv.projectId);
    const s = App.store.data.settings;
    const totals = App.invoiceTotal(inv);

    content.innerHTML = `
      <div class="breadcrumb no-print"><a href="#/invoices">Invoices</a> <span>/</span> <span>#${App.esc(inv.number)}</span></div>
      <div class="page-header no-print">
        <div>
          <div class="page-title">Invoice #${App.esc(inv.number)} ${App.invoiceStatusPill(inv)}</div>
          <div class="page-desc">${client ? `For <a href="#/clients/${client.id}" style="color:var(--accent)">${App.esc(client.name)}</a>` : ""}${project ? ` · <a href="#/projects/${project.id}" style="color:var(--accent)">${App.esc(project.name)}</a>` : ""}</div>
        </div>
        <div class="spacer"></div>
        <div class="page-actions">
          ${inv.status !== "paid" ? `<button class="btn" id="ivMarkPaid">${App.icons.check} Mark paid</button>` : ""}
          ${client && client.email ? `<button class="btn" id="ivEmail">${App.icons.mail} Email</button>` : ""}
          <button class="btn" id="ivEdit">${App.icons.edit} Edit</button>
          <button class="btn btn-primary" id="ivPrint">${App.icons.print} Print / Save PDF</button>
        </div>
      </div>

      <div class="card inv-doc">
        <div class="inv-paper">
          <div class="inv-top">
            <div>
              ${s.logo ? `<img src="${s.logo}" alt="" style="max-height:60px;max-width:200px;margin-bottom:10px">` : ""}
              <div class="inv-biz">${App.esc(s.businessName || "Your Business")}</div>
              ${s.businessAddress ? `<div style="font-size:12.5px;color:var(--text-2);margin-top:6px;white-space:pre-line">${App.esc(s.businessAddress)}</div>` : ""}
              ${s.businessEmail ? `<div style="font-size:12.5px;color:var(--text-2);margin-top:2px">${App.esc(s.businessEmail)}</div>` : ""}
              ${s.businessPhone ? `<div style="font-size:12.5px;color:var(--text-2)">${App.esc(s.businessPhone)}</div>` : ""}
            </div>
            <div>
              <div class="inv-label">Invoice</div>
              <div class="inv-num">#${App.esc(inv.number)}</div>
              <div class="inv-num">Issued: ${App.fmtDate(inv.issueDate)}</div>
              <div class="inv-num">Due: ${App.fmtDate(inv.dueDate)}</div>
            </div>
          </div>

          <div class="inv-parties">
            <div class="inv-party">
              <div class="p-label">Bill to</div>
              <div class="p-name">${App.esc(client ? client.name : "—")}</div>
              ${client && client.company ? `<div class="p-line">${App.esc(client.company)}</div>` : ""}
              ${client && client.address ? `<div class="p-line" style="white-space:pre-line">${App.esc(client.address)}</div>` : ""}
              ${client && client.email ? `<div class="p-line">${App.esc(client.email)}</div>` : ""}
            </div>
            ${project ? `<div class="inv-party"><div class="p-label">Regarding</div><div class="p-name">${App.esc(project.name)}</div></div>` : ""}
          </div>

          <table class="inv-items">
            <thead><tr><th style="width:55%">Description</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead>
            <tbody>${(inv.items || []).map(it => `
              <tr>
                <td>${App.esc(it.desc)}</td>
                <td style="text-align:right">${it.qty}</td>
                <td style="text-align:right">${App.money(it.rate)}</td>
                <td style="text-align:right;font-weight:600">${App.money((Number(it.qty) || 0) * (Number(it.rate) || 0))}</td>
              </tr>`).join("")}</tbody>
          </table>

          <div class="inv-totals">
            <div class="t-row"><span>Subtotal</span><span>${App.money(totals.sub)}</span></div>
            ${totals.tax ? `<div class="t-row"><span>Tax (${inv.taxRate}%)</span><span>${App.money(totals.tax)}</span></div>` : ""}
            <div class="t-row grand"><span>Total due</span><span>${App.money(totals.total)}</span></div>
            ${inv.status === "paid" ? `<div class="t-row" style="color:var(--green);font-weight:700"><span>PAID</span><span>${App.fmtDate(inv.paidDate)}</span></div>` : ""}
          </div>

          ${inv.notes ? `<div class="inv-notes-sec"><b>Notes</b><br>${App.esc(inv.notes)}</div>` : ""}
        </div>
      </div>`;

    const mp = content.querySelector("#ivMarkPaid");
    if (mp) mp.onclick = () => markPaid(inv);
    const em = content.querySelector("#ivEmail");
    if (em) em.onclick = () => {
      const lines = (inv.items || []).map(it => `- ${it.desc}: ${App.money((Number(it.qty) || 0) * (Number(it.rate) || 0))}`).join("\n");
      const bizName = s.businessName || "us";
      const body = `Hi ${client.name.split(" ")[0]},\n\nHere's invoice #${inv.number} from ${bizName}:\n\n${lines}\n\nTotal due: ${App.money(totals.total)}\nDue date: ${App.fmtDate(inv.dueDate)}\n\n${inv.notes || ""}\n\nThank you!\n${s.ownerName || bizName}`;
      location.href = "mailto:" + encodeURIComponent(client.email)
        + "?subject=" + encodeURIComponent(`Invoice #${inv.number} from ${bizName}`)
        + "&body=" + encodeURIComponent(body);
      App.toast("Tip: use Print / Save PDF to attach the invoice document");
    };
    content.querySelector("#ivEdit").onclick = () => App.invoiceForm(inv);
    content.querySelector("#ivPrint").onclick = () => window.print();
  }

})();

/* ============================================================
