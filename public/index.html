"use strict";

(function () {

  let filter = { status: "all", q: "" };

  const QT = (plural) => App.T("quote", plural);
  const QTC = (plural) => App.TC("quote", plural);

  App.registerRoute("quotes", function (content, route) {
    if (route.id) return renderDetail(content, route.id);
    renderList(content);
  });

  App.quoteStatusPill = function (q) {
    const expired = q.status === "sent" && q.validUntil && q.validUntil < App.todayISO();
    if (q.status === "accepted") return App.pill("Accepted", "green");
    if (q.status === "declined") return App.pill("Declined", "red");
    if (expired) return App.pill("Expired", "amber");
    if (q.status === "sent") return App.pill("Sent", "blue");
    return App.pill("Draft", "slate");
  };

  /* ---------- Editor ---------- */

  App.quoteForm = function (existing, prefill) {
    const S = App.store;
    const q = existing ? JSON.parse(JSON.stringify(existing)) : {
      number: "Q-" + (S.data.settings.quoteCounter + 1),
      clientId: (prefill && prefill.clientId) || "",
      projectId: (prefill && prefill.projectId) || "",
      issueDate: App.todayISO(),
      validUntil: App.addDaysISO(App.todayISO(), 30),
      status: "draft",
      taxRate: S.data.settings.taxRate || 0,
      items: [{ desc: "", qty: 1, rate: "" }],
      notes: App.cfg.quoteNotes || "This " + QT() + " is valid for 30 days. We'd love to work with you!"
    };

    const body = document.createElement("div");

    function draw() {
      const totals = App.invoiceTotal(q);
      body.innerHTML = `
        <div class="form-grid">
          <div class="field"><label>${QTC()} #</label><input data-k="number" value="${App.esc(q.number)}"></div>
          <div class="field"><label>Status</label>
            <select data-k="status">
              ${[["draft", "Draft"], ["sent", "Sent"], ["accepted", "Accepted"], ["declined", "Declined"]].map(([v, l]) => `<option value="${v}"${q.status === v ? " selected" : ""}>${l}</option>`).join("")}
            </select></div>
          <div class="field"><label>${App.esc(App.TC("client"))}</label>
            <select data-k="clientId">${App.clientOptions().map(([v, l]) => `<option value="${v}"${String(q.clientId) === String(v) ? " selected" : ""}>${App.esc(l)}</option>`).join("")}</select></div>
          <div class="field"><label>${App.esc(App.TC("project"))}</label>
            <select data-k="projectId">${App.projectOptions().map(([v, l]) => `<option value="${v}"${String(q.projectId) === String(v) ? " selected" : ""}>${App.esc(l)}</option>`).join("")}</select></div>
          <div class="field"><label>Date</label><input data-k="issueDate" type="date" value="${App.esc(q.issueDate)}"></div>
          <div class="field"><label>Valid until</label><input data-k="validUntil" type="date" value="${App.esc(q.validUntil)}"></div>
        </div>

        <div style="margin:18px 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-3)">Line items</div>
        <div id="qItems">${q.items.map((it, i) => itemRow(it, i)).join("")}</div>
        <button class="btn btn-sm" id="qAddItem" style="margin-top:8px">${App.icons.plus} Add line</button>

        <div style="display:flex;justify-content:flex-end;margin-top:16px">
          <div style="width:250px">
            <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span class="muted">Subtotal</span><b>${App.money(totals.sub)}</b></div>
            <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;align-items:center">
              <span class="muted">Tax %</span>
              <input data-k="taxRate" type="number" step="0.01" min="0" value="${q.taxRate || 0}" style="width:80px;text-align:right;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:4px 8px">
            </div>
            <div style="display:flex;justify-content:space-between;font-size:15px;padding:8px 0;border-top:2px solid var(--border);margin-top:4px"><b>Total</b><b>${App.money(totals.total)}</b></div>
          </div>
        </div>

        <div class="field" style="margin-top:8px"><label>Notes / terms</label>
          <textarea data-k="notes">${App.esc(q.notes || "")}</textarea></div>`;

      body.querySelectorAll("[data-k]").forEach(el => {
        el.onchange = () => {
          let v = el.value;
          if (el.dataset.k === "taxRate") v = Number(v) || 0;
          q[el.dataset.k] = v;
          if (el.dataset.k === "taxRate") draw();
        };
      });
      body.querySelectorAll("[data-item]").forEach(el => {
        el.onchange = () => {
          const [idx, key] = el.dataset.item.split(":");
          q.items[Number(idx)][key] = key === "desc" ? el.value : (el.value === "" ? "" : Number(el.value));
          draw();
        };
      });
      body.querySelectorAll("[data-rm]").forEach(el => {
        el.onclick = () => { q.items.splice(Number(el.dataset.rm), 1); if (!q.items.length) q.items.push({ desc: "", qty: 1, rate: "" }); draw(); };
      });
      body.querySelector("#qAddItem").onclick = () => { q.items.push({ desc: "", qty: 1, rate: "" }); draw(); };
    }

    function itemRow(it, i) {
      return `<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
        <input data-item="${i}:desc" placeholder="Description" value="${App.esc(it.desc)}" style="flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13px">
        <input data-item="${i}:qty" type="number" step="0.01" min="0" placeholder="Qty" value="${it.qty}" style="width:74px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;text-align:right">
        <input data-item="${i}:rate" type="number" step="0.01" min="0" placeholder="Rate" value="${it.rate}" style="width:100px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;text-align:right">
        <div style="width:88px;text-align:right;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums">${App.money((Number(it.qty) || 0) * (Number(it.rate) || 0))}</div>
        <button class="icon-btn" data-rm="${i}" title="Remove">${App.icons.x}</button>
      </div>`;
    }

    draw();

    App.modal({
      title: existing ? "Edit " + QT() + " " + existing.number : "New " + QT(),
      body, wide: true,
      onOpen(overlay, close) {
        const foot = document.createElement("div");
        foot.style.cssText = "display:flex;justify-content:flex-end;gap:9px;padding:0 22px 20px";
        foot.innerHTML = `<button class="btn">Cancel</button><button class="btn btn-primary">${existing ? "Save changes" : "Create " + App.esc(QT())}</button>`;
        overlay.querySelector(".modal").appendChild(foot);
        foot.children[0].onclick = close;
        foot.children[1].onclick = () => {
          q.items = q.items.filter(it => it.desc || it.rate);
          if (!q.items.length) return App.toast("Add at least one line item", "error");
          if (existing) {
            App.store.update("quotes", existing.id, q);
            App.toast(QTC() + " updated");
          } else {
            S.data.settings.quoteCounter += 1;
            const saved = App.store.add("quotes", q);
            const cname = App.rel.clientName(saved.clientId);
            App.store.log("invoices", `Created ${QT()} <b>${App.esc(saved.number)}</b>${cname ? " for <b>" + App.esc(cname) + "</b>" : ""} — ${App.money(App.invoiceTotal(saved).total)}`);
            App.store.save();
            App.toast(QTC() + " " + saved.number + " created");
          }
          close();
          App.render();
        };
      }
    });
  };

  /* ---------- Status changes + conversion ---------- */

  function setStatus(q, status) {
    App.store.update("quotes", q.id, { status });
    if (status === "accepted") {
      const cname = App.rel.clientName(q.clientId);
      App.store.log("check", `${QTC()} <b>${App.esc(q.number)}</b> accepted${cname ? " by <b>" + App.esc(cname) + "</b>" : ""} 🎉`);
      App.store.save();
      App.webhook("quote.accepted", { number: q.number, client: cname, total: App.invoiceTotal(q).total });
      App.toast("Accepted — nice work! 🎉");
    } else {
      App.toast("Marked " + status);
    }
    App.render();
  }

  function convertToInvoice(q) {
    const S = App.store;
    S.data.settings.invoiceCounter += 1;
    const inv = App.store.add("invoices", {
      number: String(S.data.settings.invoiceCounter),
      clientId: q.clientId, projectId: q.projectId,
      issueDate: App.todayISO(), dueDate: App.addDaysISO(App.todayISO(), 14),
      status: "draft", taxRate: q.taxRate || 0,
      items: JSON.parse(JSON.stringify(q.items)),
      notes: "", quoteId: q.id
    });
    App.store.update("quotes", q.id, { status: "accepted", convertedInvoiceId: inv.id });
    App.store.log("invoices", `Converted ${QT()} <b>${App.esc(q.number)}</b> to invoice <b>#${App.esc(inv.number)}</b>`);
    App.store.save();
    App.toast("Invoice #" + inv.number + " created from " + QT());
    App.nav("#/invoices/" + inv.id);
  }

  /* ---------- List ---------- */

  function renderList(content) {
    let list = App.store.all("quotes").slice();
    const today = App.todayISO();

    const open = list.filter(x => x.status === "sent" && !(x.validUntil && x.validUntil < today));
    const accepted = list.filter(x => x.status === "accepted");
    const decided = list.filter(x => x.status === "accepted" || x.status === "declined");
    const winRate = decided.length ? Math.round(accepted.length / decided.length * 100) : null;
    const sum = arr => arr.reduce((s, x) => s + App.invoiceTotal(x).total, 0);

    if (filter.q) {
      const ql = filter.q.toLowerCase();
      list = list.filter(x => (x.number + " " + (App.rel.clientName(x.clientId) || "")).toLowerCase().includes(ql));
    }
    if (filter.status !== "all") {
      if (filter.status === "expired") list = list.filter(x => x.status === "sent" && x.validUntil && x.validUntil < today);
      else list = list.filter(x => x.status === filter.status);
    }
    list.sort((a, b) => (b.issueDate || "").localeCompare(a.issueDate || "") || b.createdAt - a.createdAt);

    content.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">${App.esc(QTC(true))}</div>
          <div class="page-desc">Win the work first — then one click turns a ${App.esc(QT())} into an invoice.</div>
        </div>
        <div class="spacer"></div>
        <div class="page-actions">
          <button class="btn btn-primary" id="qNew">${App.icons.plus} New ${App.esc(QT())}</button>
        </div>
      </div>

      <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
        <div class="kpi" style="--kpi-color:var(--blue)"><div class="kpi-label">Awaiting answer</div><div class="kpi-value" style="font-size:20px">${App.money(sum(open))}</div><div class="kpi-sub">${open.length} open</div></div>
        <div class="kpi" style="--kpi-color:var(--green)"><div class="kpi-label">Won</div><div class="kpi-value" style="font-size:20px">${App.money(sum(accepted))}</div><div class="kpi-sub">${accepted.length} accepted</div></div>
        <div class="kpi" style="--kpi-color:var(--purple)"><div class="kpi-label">Win rate</div><div class="kpi-value" style="font-size:20px">${winRate == null ? "—" : winRate + "%"}</div><div class="kpi-sub">${decided.length} decided</div></div>
      </div>

      <div class="filter-bar mt-16">
        <div class="seg">
          ${[["all", "All"], ["draft", "Draft"], ["sent", "Sent"], ["accepted", "Accepted"], ["declined", "Declined"], ["expired", "Expired"]].map(([v, l]) =>
            `<button data-s="${v}" class="${filter.status === v ? "active" : ""}">${l}</button>`).join("")}
        </div>
        <input type="text" id="qSearch" placeholder="Search…" value="${App.esc(filter.q)}">
      </div>

      <div class="card" id="qTable"></div>`;

    content.querySelector("#qNew").onclick = () => App.quoteForm();
    content.querySelectorAll(".seg button").forEach(b => b.onclick = () => { filter.status = b.dataset.s; renderList(content); });
    content.querySelector("#qSearch").oninput = App.debounce(e => {
      filter.q = e.target.value; renderList(content);
      const el = content.querySelector("#qSearch"); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    }, 200);

    const card = content.querySelector("#qTable");
    if (!list.length) {
      card.appendChild(App.emptyState("invoices",
        App.store.all("quotes").length ? "No matches" : "No " + QT(true) + " yet",
        App.store.all("quotes").length ? "Try a different filter." : "Send professional " + QT(true) + " in minutes — and see your win rate climb.",
        "Create " + QT(), () => App.quoteForm()));
      return;
    }

    card.innerHTML = `<div class="table-wrap"><table class="data">
      <thead><tr><th>#</th><th>${App.esc(App.TC("client"))}</th><th>Date</th><th>Valid until</th><th>Status</th><th class="num">Total</th><th></th></tr></thead>
      <tbody>${list.map(x => `
        <tr class="clickable" data-id="${x.id}">
          <td class="td-main">${App.esc(x.number)}</td>
          <td>${App.esc(App.rel.clientName(x.clientId) || "—")}</td>
          <td>${App.fmtDateShort(x.issueDate)}</td>
          <td>${App.fmtDateShort(x.validUntil)}</td>
          <td>${App.quoteStatusPill(x)}</td>
          <td class="num" style="font-weight:680">${App.money(App.invoiceTotal(x).total)}</td>
          <td><div class="td-actions">
            ${x.status === "sent" ? `<button class="btn btn-sm" data-accept="${x.id}">Accept</button>` : ""}
            ${x.status === "accepted" && !x.convertedInvoiceId ? `<button class="btn btn-sm" data-convert="${x.id}">→ Invoice</button>` : ""}
            <button class="icon-btn" data-edit="${x.id}">${App.icons.edit}</button>
            <button class="icon-btn" data-del="${x.id}">${App.icons.trash}</button>
          </div></td>
        </tr>`).join("")}</tbody></table></div>`;

    card.querySelectorAll("tr.clickable").forEach(tr => tr.onclick = (e) => {
      if (e.target.closest("button")) return;
      App.nav("#/quotes/" + tr.dataset.id);
    });
    card.querySelectorAll("[data-accept]").forEach(b => b.onclick = () => setStatus(App.store.get("quotes", b.dataset.accept), "accepted"));
    card.querySelectorAll("[data-convert]").forEach(b => b.onclick = () => convertToInvoice(App.store.get("quotes", b.dataset.convert)));
    card.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => App.quoteForm(App.store.get("quotes", b.dataset.edit)));
    card.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      const x = App.store.get("quotes", b.dataset.del);
      App.confirm("Delete " + QT() + "?", `<b>${App.esc(x.number)}</b> will be permanently removed.`, () => {
        App.store.remove("quotes", x.id);
        App.toast("Deleted");
        renderList(content);
      }, true);
    });
  }

  /* ---------- Detail / printable document ---------- */

  function renderDetail(content, id) {
    const q = App.store.get("quotes", id);
    if (!q) { content.innerHTML = `<div class="empty"><h3>Not found</h3></div>`; return; }
    const client = App.store.get("clients", q.clientId);
    const project = App.store.get("projects", q.projectId);
    const s = App.store.data.settings;
    const totals = App.invoiceTotal(q);

    content.innerHTML = `
      <div class="breadcrumb no-print"><a href="#/quotes">${App.esc(QTC(true))}</a> <span>/</span> <span>${App.esc(q.number)}</span></div>
      <div class="page-header no-print">
        <div>
          <div class="page-title">${App.esc(QTC())} ${App.esc(q.number)} ${App.quoteStatusPill(q)}</div>
          <div class="page-desc">${client ? `For <a href="#/clients/${client.id}" style="color:var(--accent)">${App.esc(client.name)}</a>` : ""}${q.convertedInvoiceId ? ` · <a href="#/invoices/${q.convertedInvoiceId}" style="color:var(--accent)">View invoice</a>` : ""}</div>
        </div>
        <div class="spacer"></div>
        <div class="page-actions">
          ${q.status === "sent" || q.status === "draft" ? `<button class="btn" id="qdAccept">${App.icons.check} Mark accepted</button>` : ""}
          ${q.status === "sent" ? `<button class="btn btn-danger" id="qdDecline">Declined</button>` : ""}
          ${q.status === "accepted" && !q.convertedInvoiceId ? `<button class="btn btn-primary" id="qdConvert">${App.icons.invoices} Convert to invoice</button>` : ""}
          ${client && client.email ? `<button class="btn" id="qdEmail">${App.icons.mail} Email</button>` : ""}
          <button class="btn" id="qdEdit">${App.icons.edit} Edit</button>
          <button class="btn ${q.status === "accepted" && !q.convertedInvoiceId ? "" : "btn-primary"}" id="qdPrint">${App.icons.print} Print / Save PDF</button>
        </div>
      </div>

      <div class="card inv-doc">
        <div class="inv-paper">
          <div class="inv-top">
            <div>
              ${s.logo ? `<img src="${s.logo}" alt="" style="max-height:60px;max-width:200px;margin-bottom:10px">` : ""}
              <div class="inv-biz">${App.esc(s.businessName || "Your Business")}</div>
              ${s.businessAddress ? `<div style="font-size:12.5px;color:var(--text-2);margin-top:6px;white-space:pre-line">${App.esc(s.businessAddress)}</div>` : ""}
              ${s.businessEmail ? `<div style="font-size:12.5px;color:var(--text-2);margin-top:2px">${App.esc(s.businessEmail)}</div>` : ""}
              ${s.businessPhone ? `<div style="font-size:12.5px;color:var(--text-2)">${App.esc(s.businessPhone)}</div>` : ""}
            </div>
            <div>
              <div class="inv-label">${App.esc(QT())}</div>
              <div class="inv-num">${App.esc(q.number)}</div>
              <div class="inv-num">Date: ${App.fmtDate(q.issueDate)}</div>
              <div class="inv-num">Valid until: ${App.fmtDate(q.validUntil)}</div>
            </div>
          </div>

          <div class="inv-parties">
            <div class="inv-party">
              <div class="p-label">Prepared for</div>
              <div class="p-name">${App.esc(client ? client.name : "—")}</div>
              ${client && client.company ? `<div class="p-line">${App.esc(client.company)}</div>` : ""}
              ${client && client.address ? `<div class="p-line" style="white-space:pre-line">${App.esc(client.address)}</div>` : ""}
              ${client && client.email ? `<div class="p-line">${App.esc(client.email)}</div>` : ""}
            </div>
            ${project ? `<div class="inv-party"><div class="p-label">Regarding</div><div class="p-name">${App.esc(project.name)}</div></div>` : ""}
          </div>

          <table class="inv-items">
            <thead><tr><th style="width:55%">Description</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead>
            <tbody>${(q.items || []).map(it => `
              <tr>
                <td>${App.esc(it.desc)}</td>
                <td style="text-align:right">${it.qty}</td>
                <td style="text-align:right">${App.money(it.rate)}</td>
                <td style="text-align:right;font-weight:600">${App.money((Number(it.qty) || 0) * (Number(it.rate) || 0))}</td>
              </tr>`).join("")}</tbody>
          </table>

          <div class="inv-totals">
            <div class="t-row"><span>Subtotal</span><span>${App.money(totals.sub)}</span></div>
            ${totals.tax ? `<div class="t-row"><span>Tax (${q.taxRate}%)</span><span>${App.money(totals.tax)}</span></div>` : ""}
            <div class="t-row grand"><span>Total</span><span>${App.money(totals.total)}</span></div>
          </div>

          ${q.notes ? `<div class="inv-notes-sec"><b>Notes</b><br>${App.esc(q.notes)}</div>` : ""}
        </div>
      </div>`;

    const on = (sel, fn) => { const el = content.querySelector(sel); if (el) el.onclick = fn; };
    on("#qdAccept", () => setStatus(q, "accepted"));
    on("#qdDecline", () => setStatus(q, "declined"));
    on("#qdConvert", () => convertToInvoice(q));
    on("#qdEdit", () => App.quoteForm(q));
    on("#qdPrint", () => window.print());
    on("#qdEmail", () => {
      const lines = (q.items || []).map(it => `- ${it.desc}: ${App.money((Number(it.qty) || 0) * (Number(it.rate) || 0))}`).join("\n");
      const bizName = s.businessName || "us";
      const bodyTxt = `Hi ${client.name.split(" ")[0]},\n\nHere's your ${QT()} ${q.number} from ${bizName}:\n\n${lines}\n\nTotal: ${App.money(totals.total)}\nValid until: ${App.fmtDate(q.validUntil)}\n\n${q.notes || ""}\n\n${s.ownerName || bizName}`;
      location.href = "mailto:" + encodeURIComponent(client.email)
        + "?subject=" + encodeURIComponent(`Your ${QT()} from ${bizName} (${q.number})`)
        + "&body=" + encodeURIComponent(bodyTxt);
      if (q.status === "draft") App.store.update("quotes", q.id, { status: "sent" });
      App.toast("Tip: use Print / Save PDF to attach the document");
    });
  }

})();

/* ============================================================
   Module: Calendar — month grid + event editor
   ============================================================ */

"use strict";

(function () {

  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth(); // 0-based

  App.registerRoute("calendar", function (content) {
    render(content);
  });

  App.eventForm = function (existing, prefill) {
    App.formModal({
      title: existing ? "Edit event" : "New event",
      values: existing || prefill || {},
      fields: [
        { key: "title", label: "Title", required: true, full: true, placeholder: App.cfg.eventPlaceholder || "e.g. Site visit, consultation…" },
        { key: "date", label: "Date", type: "date", required: true, value: existing ? existing.date : (prefill && prefill.date) || App.todayISO() },
        { key: "time", label: "Time", type: "time" },
        { key: "clientId", label: App.TC("client"), type: "select", options: App.clientOptions() },
        { key: "projectId", label: App.TC("project"), type: "select", options: App.projectOptions() },
        { key: "location", label: "Location", full: true },
        { key: "notes", label: "Notes", type: "textarea", full: true }
      ],
      onSubmit(values, close) {
        if (existing) {
          App.store.update("events", existing.id, values);
          App.toast("Event updated");
        } else {
          const e = App.store.add("events", values);
          App.store.log("calendar", `Scheduled <b>${App.esc(e.title)}</b> for ${App.fmtDate(e.date)}`);
          App.store.save();
          App.toast("Event added");
        }
        close();
        App.render();
      }
    });
  };

  function render(content) {
    const events = App.store.all("events");
    const first = new Date(viewYear, viewMonth, 1);
    const monthLabel = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const today = App.todayISO();

    // build 6-week grid starting Sunday
    const startDow = first.getDay();
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(viewYear, viewMonth, 1 - startDow + i);
      const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      cells.push({ d, iso, other: d.getMonth() !== viewMonth });
    }

    const upcoming = events.filter(e => e.date >= today)
      .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || ""))).slice(0, 8);

    content.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">Calendar</div>
          <div class="page-desc">Appointments, deadlines, and everything time-sensitive.</div>
        </div>
        <div class="spacer"></div>
        <div class="page-actions">
          <button class="btn" id="calImport" title="Import events from Google Calendar, Outlook or Apple Calendar exports">${App.icons.upload} Import .ics</button>
          <button class="btn" id="calExport" title="Download upcoming events for any calendar app">${App.icons.download} Export .ics</button>

      <div class="grid-3-2">
        <div>
          <div class="cal-head">
            <button class="icon-btn" id="calPrev">${App.icons.chevL}</button>
            <div class="cal-month">${monthLabel}</div>
            <button class="icon-btn" id="calNext">${App.icons.chevR}</button>
            <button class="btn btn-ghost btn-sm" id="calToday">Today</button>
          </div>
          <div class="cal-grid">
            ${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="cal-dow">${d}</div>`).join("")}
            ${cells.map(c => {
              const dayEvents = events.filter(e => e.date === c.iso).sort((a, b) => (a.time || "").localeCompare(b.time || ""));
              return `<div class="cal-cell${c.other ? " other" : ""}${c.iso === today ? " today" : ""}" data-date="${c.iso}">
                <span class="cal-daynum">${c.d.getDate()}</span>
                <div class="cal-events">
                  ${dayEvents.slice(0, 3).map(e => `<div class="cal-event" data-ev="${e.id}" title="${App.esc(e.title)}">${e.time ? e.time + " " : ""}${App.esc(e.title)}</div>`).join("")}
                  ${dayEvents.length > 3 ? `<div class="cal-more">+${dayEvents.length - 3} more</div>` : ""}
                </div>
              </div>`;
            }).join("")}
          </div>

        <div class="card">
          <div class="card-title" style="padding:18px 22px 0">Coming up</div>

    content.querySelector("#calNew").onclick = () => App.eventForm();

    content.querySelector("#calExport").onclick = () => {
      const upcoming = App.store.all("events").filter(e => e.date >= App.todayISO());
      if (!upcoming.length) return App.toast("No upcoming events to export", "error");
      App.ics.download(App.cfg.productName + "-calendar.ics", upcoming);
      App.toast("Exported " + upcoming.length + " events — open the file in any calendar app");
    };

    content.querySelector("#calImport").onclick = () => {
      App.pickFile(".ics,text/calendar", (text) => {
        let parsed;
        try { parsed = App.ics.parse(text); } catch (e) { return App.toast("Couldn't read that calendar file", "error"); }
        if (!parsed.length) return App.toast("No events found in that file", "error");
        App.confirm("Import " + parsed.length + " events?",
          "Events from the file will be added to your calendar. Already-imported events are skipped.",
          () => {
            let added = 0;
            parsed.forEach(ev => {
              if (ev.uid && App.store.data.events.find(x => x.externalId === "ics:" + ev.uid)) return;
              App.store.data.events.push({
                id: App.uid(), title: ev.title, date: ev.date, time: ev.time || "",
                location: ev.location || "", notes: ev.notes || "",
                externalId: ev.uid ? "ics:" + ev.uid : null,
                createdAt: Date.now(), updatedAt: Date.now()
              });
              added++;
            });
            App.store.log("calendar", `Imported <b>${added}</b> events from a calendar file`);
            App.store.save();
            App.toast("Imported " + added + " events");
            render(content);
          });
      });
    };
    content.querySelector("#calPrev").onclick = () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } render(content); };
    content.querySelector("#calNext").onclick = () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } render(content); };
    content.querySelector("#calToday").onclick = () => { viewYear = now.getFullYear(); viewMonth = now.getMonth(); render(content); };

    content.querySelectorAll(".cal-cell").forEach(cell => {
      cell.onclick = (e) => {
        if (e.target.closest(".cal-event")) return;
        App.eventForm(null, { date: cell.dataset.date });
      };
    });
    content.querySelectorAll(".cal-event").forEach(el => {
      el.onclick = () => openEvent(el.dataset.ev, content);
    });

    const up = content.querySelector("#calUpcoming");
    up.innerHTML = upcoming.length ? upcoming.map(e => `
      <div style="display:flex;gap:12px;padding:11px 22px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer" data-ev="${e.id}">
        <div style="text-align:center;min-width:44px;background:var(--accent-soft);border-radius:9px;padding:5px 7px">
          <div style="font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--accent)">${new Date(e.date + "T00:00:00").toLocaleDateString(undefined, { month: "short" })}</div>
          <div style="font-size:16px;font-weight:750;color:var(--accent)">${new Date(e.date + "T00:00:00").getDate()}</div>
        </div>
        <div style="min-width:0">
          <div style="font-weight:620;font-size:13px">${App.esc(e.title)}</div>
          <div class="td-sub">${e.time ? e.time + " · " : ""}${App.linkChips(e) || App.esc(e.location || "")}</div>
        </div>
      </div>`).join("") : `<div class="card-pad"><p class="muted" style="font-size:13px">Nothing coming up. Click any day on the calendar to add an event.</p></div>`;
    up.querySelectorAll("[data-ev]").forEach(el => el.onclick = () => openEvent(el.dataset.ev, content));
  }

  function openEvent(id, content) {
    const e = App.store.get("events", id);
    if (!e) return;
    App.modal({
      title: App.esc(e.title),
      body: `
        <div class="prop-list">
          <div class="prop"><span class="prop-k">When</span><span class="prop-v">${App.fmtDate(e.date)}${e.time ? " at " + e.time : ""}</span></div>
          ${e.location ? `<div class="prop"><span class="prop-k">Where</span><span class="prop-v">${App.esc(e.location)}</span></div>` : ""}
          ${App.linkChips(e) ? `<div class="prop"><span class="prop-k">Linked to</span><span class="prop-v">${App.linkChips(e)}</span></div>` : ""}
          ${e.notes ? `<div class="prop"><span class="prop-k">Notes</span><span class="prop-v">${App.esc(e.notes)}</span></div>` : ""}
        </div>`,
      onOpen(overlay, close) {
        const foot = document.createElement("div");
        foot.style.cssText = "display:flex;justify-content:flex-end;gap:9px;padding:0 22px 20px";
        foot.innerHTML = `<button class="btn btn-danger">Delete</button><button class="btn" title="Download for Google/Outlook/Apple Calendar">${App.icons.download} .ics</button><button class="btn">Edit</button><button class="btn btn-primary">Done</button>`;
        overlay.querySelector(".modal").appendChild(foot);
        foot.children[0].onclick = () => { close(); App.confirm("Delete event?", `<b>${App.esc(e.title)}</b> will be removed.`, () => { App.store.remove("events", e.id); App.toast("Event deleted"); render(content); }, true); };
        foot.children[1].onclick = () => { App.ics.download(e.title.replace(/[^\w ]/g, "").slice(0, 30) + ".ics", [e]); App.toast("Open the file to add it to your calendar"); };
        foot.children[2].onclick = () => { close(); App.eventForm(e); };
        foot.children[3].onclick = close;
      }
    });
  }

})();

(function () {

  App.registerRoute("notes", function (content, route) {

  });

  function render(content, activeId) {
    const notes = App.store.all("notes").slice().sort((a, b) => b.updatedAt - a.updatedAt);
    const active = activeId ? App.store.get("notes", activeId) : null;

    content.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">Notes</div>
          <div class="page-desc">Meeting notes, ideas, procedures — linked to the ${App.esc(App.T("client", true))} and ${App.esc(App.T("project", true))} they belong to.</div>

        </div>
      </div>

      <div class="notes-layout">
        <div class="card" id="noteList" style="max-height:70vh;overflow-y:auto"></div>
        <div class="card card-pad" id="noteEditor"></div>
      </div>`;

    content.querySelector("#noteNew").onclick = () => {
      const n = App.store.add("notes", { title: "", body: "" });
      App.nav("#/notes/" + n.id);
    };

    const listEl = content.querySelector("#noteList");
    listEl.innerHTML = notes.length ? notes.map(n => `
      <div class="note-list-item${active && n.id === active.id ? " active" : ""}" data-id="${n.id}">
        <div class="n-title">${App.esc(n.title || "Untitled")}</div>

        <div class="n-date">${App.timeAgo(n.updatedAt)}${App.linkChips(n) ? " · linked" : ""}</div>
      </div>`).join("") : `<div class="card-pad"><p class="muted" style="font-size:13px">No notes yet.</p></div>`;

    listEl.querySelectorAll(".note-list-item").forEach(el => el.onclick = () => App.nav("#/notes/" + el.dataset.id));

    const ed = content.querySelector("#noteEditor");
    if (!active) {
      ed.appendChild(App.emptyState("notes", "Select or create a note", "Notes autosave as you type and stay linked to your work."));
      return;
    }

    ed.innerHTML = `
      <input class="note-editor-title" id="nTitle" placeholder="Note title…" value="${App.esc(active.title)}">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:4px;flex-wrap:wrap">
        <select id="nClient" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer">
          ${App.clientOptions().map(([v, l]) => `<option value="${v}"${String(active.clientId || "") === String(v) ? " selected" : ""}>${App.esc(v ? "👤 " + l : "Link " + App.T("client") + "…")}</option>`).join("")}
        </select>
        <select id="nProject" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer">
          ${App.projectOptions().map(([v, l]) => `<option value="${v}"${String(active.projectId || "") === String(v) ? " selected" : ""}>${App.esc(v ? "📁 " + l : "Link " + App.T("project") + "…")}</option>`).join("")}
        </select>
        <span class="muted" style="font-size:11.5px;margin-left:auto" id="nSaved">Saved</span>
        <button class="icon-btn" id="nDelete" title="Delete note">${App.icons.trash}</button>
      </div>
      <div class="note-toolbar">
        <button data-cmd="bold" title="Bold"><b>B</b></button>
        <button data-cmd="italic" title="Italic"><i>I</i></button>
        <button data-cmd="underline" title="Underline"><u>U</u></button>
        <button data-cmd="insertUnorderedList" title="Bullet list">•</button>
        <button data-cmd="insertOrderedList" title="Numbered list">1.</button>
      </div>
      <div class="note-editor-body" id="nBody" contenteditable="true"></div>`;

    // contenteditable content set via property to avoid attribute-escaping issues
    ed.querySelector("#nBody").innerHTML = active.body || "";

    const savedEl = ed.querySelector("#nSaved");
    const persist = App.debounce(() => {
      App.store.update("notes", active.id, {
        title: ed.querySelector("#nTitle").value,
        body: ed.querySelector("#nBody").innerHTML
      });
      savedEl.textContent = "Saved";
      // refresh list preview without full re-render
      const item = listEl.querySelector(`[data-id="${active.id}"]`);
      if (item) {
        item.querySelector(".n-title").textContent = ed.querySelector("#nTitle").value || "Untitled";
        item.querySelector(".n-preview").textContent = ed.querySelector("#nBody").textContent.trim().slice(0, 70) || "Empty note";
      }
    }, 600);

    const markDirty = () => { savedEl.textContent = "Saving…"; persist(); };
    ed.querySelector("#nTitle").addEventListener("input", markDirty);
    ed.querySelector("#nBody").addEventListener("input", markDirty);

    ed.querySelector("#nClient").onchange = (e) => { App.store.update("notes", active.id, { clientId: e.target.value || null }); App.toast("Link updated"); };
    ed.querySelector("#nProject").onchange = (e) => { App.store.update("notes", active.id, { projectId: e.target.value || null }); App.toast("Link updated"); };

    ed.querySelectorAll(".note-toolbar button").forEach(b => {
      b.onmousedown = (e) => { e.preventDefault(); document.execCommand(b.dataset.cmd, false, null); markDirty(); };
    });

    ed.querySelector("#nDelete").onclick = () => {
      App.confirm("Delete note?", `<b>${App.esc(active.title || "Untitled")}</b> will be permanently removed.`, () => {
        App.store.remove("notes", active.id);
        App.toast("Note deleted");
        App.nav("#/notes");
      }, true);
    };
  }

})();

   Module: Reports — the numbers that run the business
   ============================================================ */

"use strict";

(function () {

  let period = "year"; // month | lastmonth | year | all

  App.registerRoute("reports", function (content) {
    render(content);
  });

  function periodRange() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    if (period === "month") return { from: iso(new Date(y, m, 1)), to: iso(new Date(y, m + 1, 0)), label: "This month" };
    if (period === "lastmonth") return { from: iso(new Date(y, m - 1, 1)), to: iso(new Date(y, m, 0)), label: "Last month" };
    if (period === "year") return { from: y + "-01-01", to: y + "-12-31", label: String(y) };
    return { from: "0000-01-01", to: "9999-12-31", label: "All time" };
  }

  function render(content) {
    const { from, to, label } = periodRange();
    const inRange = d => d && d >= from && d <= to;
    const S = App.store;
    const today = App.todayISO();

    const invoices = S.all("invoices");
    const paid = invoices.filter(i => i.status === "paid" && inRange(i.paidDate));
    const issued = invoices.filter(i => inRange(i.issueDate));
    const outstanding = invoices.filter(i => i.status === "sent");
    const sum = arr => arr.reduce((s, i) => s + App.invoiceTotal(i).total, 0);

    const quotes = S.all("quotes").filter(q => inRange(q.issueDate));
    const decided = quotes.filter(q => q.status === "accepted" || q.status === "declined");
    const won = quotes.filter(q => q.status === "accepted");
    const winRate = decided.length ? Math.round(won.length / decided.length * 100) : null;

    const tasksDone = S.all("tasks").filter(t => t.done && inRange(new Date(t.updatedAt).toISOString().slice(0, 10)));
    const timeLogs = S.all("timelogs").filter(l => l.endTs && inRange(new Date(l.startTs).toISOString().slice(0, 10)));
    const hours = Math.round(timeLogs.reduce((s, l) => s + (l.endTs - l.startTs), 0) / 36000) / 100;

    // top clients by paid revenue in range
    const byClient = {};
    paid.forEach(i => {
      const name = App.rel.clientName(i.clientId) || "(no " + App.T("client") + ")";
      byClient[name] = (byClient[name] || 0) + App.invoiceTotal(i).total;
    });
    const topClients = Object.entries(byClient).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const maxClient = topClients.length ? topClients[0][1] : 1;

    // invoice aging (always current, not period-bound)
    const aging = { current: 0, d30: 0, d60: 0, d90: 0 };
    outstanding.forEach(i => {
      const t = App.invoiceTotal(i).total;
      if (!i.dueDate || i.dueDate >= today) aging.current += t;
      else {
        const days = Math.floor((new Date(today) - new Date(i.dueDate)) / 86400000);
        if (days <= 30) aging.d30 += t;
        else if (days <= 60) aging.d60 += t;
        else aging.d90 += t;
      }
    });

    // monthly revenue chart within range (up to 12 columns)
    const months = [];
    const end = new Date(Math.min(new Date(to + "T00:00:00").getTime(), Date.now()));
    for (let i = 11; i >= 0; i--) {
      const d = new Date(end.getFullYear(), end.getMonth() - i, 1);
      const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      months.push({ key, label: d.toLocaleDateString(undefined, { month: "short" }), value: 0 });
    }
    S.all("invoices").filter(i => i.status === "paid" && i.paidDate).forEach(i => {
      const m = months.find(m => m.key === i.paidDate.slice(0, 7));
      if (m) m.value += App.invoiceTotal(i).total;
    });

    content.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">Reports</div>
          <div class="page-desc">How the business is actually doing — ${App.esc(label.toLowerCase())}.</div>
        </div>
        <div class="spacer"></div>
        <div class="page-actions no-print">
          <div class="seg">
            ${[["month", "This month"], ["lastmonth", "Last month"], ["year", "This year"], ["all", "All time"]].map(([v, l]) =>
              `<button data-p="${v}" class="${period === v ? "active" : ""}">${l}</button>`).join("")}
          </div>
          <button class="btn" id="repPrint">${App.icons.print} Print</button>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi" style="--kpi-color:var(--green)">
          <div class="kpi-label">${App.icons.money} Collected</div>
          <div class="kpi-value">${App.money(sum(paid))}</div>
          <div class="kpi-sub">${paid.length} invoices paid</div>
        </div>
        <div class="kpi" style="--kpi-color:var(--blue)">
          <div class="kpi-label">${App.icons.invoices} Invoiced</div>
          <div class="kpi-value">${App.money(sum(issued))}</div>
          <div class="kpi-sub">${issued.length} invoices issued</div>
        </div>
        <div class="kpi" style="--kpi-color:var(--purple)">
          <div class="kpi-label">${App.icons.trend} ${App.esc(App.TC("quote"))} win rate</div>
          <div class="kpi-value">${winRate == null ? "—" : winRate + "%"}</div>
          <div class="kpi-sub">${won.length} won of ${decided.length} decided</div>
        </div>
        <div class="kpi" style="--kpi-color:var(--amber)">
          <div class="kpi-label">${App.icons.clock} Activity</div>
          <div class="kpi-value">${tasksDone.length}<span class="muted" style="font-size:14px;font-weight:500"> tasks</span></div>
          <div class="kpi-sub">${hours ? hours + "h tracked" : "no time tracked"}</div>
        </div>
      </div>

      <div class="grid-3-2 mb-16">
        <div class="card card-pad">
          <div class="card-title">Revenue by month</div>
          ${App.charts.bar(months.map(m => ({ label: m.label, value: m.value })))}
        </div>
        <div class="card card-pad">
          <div class="card-title">Who owes you — aging</div>
          <div class="prop-list">
            ${[["Not yet due", aging.current, "green"], ["1–30 days late", aging.d30, "amber"], ["31–60 days late", aging.d60, "red"], ["60+ days late", aging.d90, "red"]].map(([l, v, c]) => `
              <div class="prop"><span class="prop-k" style="width:150px">${l}</span>
                <span class="prop-v" style="font-weight:700;color:var(--${c})">${App.money(v)}</span></div>`).join("")}
            <div class="prop"><span class="prop-k" style="width:150px"><b>Total outstanding</b></span>
              <span class="prop-v" style="font-weight:780">${App.money(aging.current + aging.d30 + aging.d60 + aging.d90)}</span></div>
          </div>
          ${aging.d60 + aging.d90 > 0 ? `<p style="font-size:12.5px;color:var(--red);margin-top:12px">💡 ${App.money(aging.d60 + aging.d90)} is more than 30 days late — worth a friendly call.</p>` : ""}
        </div>
      </div>

      <div class="card card-pad">
        <div class="card-title">Top ${App.esc(App.T("client", true))} — ${App.esc(label.toLowerCase())}</div>
        ${topClients.length ? topClients.map(([name, v]) => `
          <div style="display:flex;align-items:center;gap:14px;padding:8px 0">
            <span style="width:170px;font-size:13px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${App.esc(name)}</span>
            <div style="flex:1">${App.charts.progress(v / maxClient * 100)}</div>
            <span style="width:90px;text-align:right;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums">${App.money(v)}</span>
          </div>`).join("") : `<p class="muted" style="font-size:13px">No paid invoices in this period yet.</p>`}
      </div>`;

    content.querySelectorAll(".seg button").forEach(b => b.onclick = () => { period = b.dataset.p; render(content); });
    content.querySelector("#repPrint").onclick = () => window.print();
  }

})();

/* ============================================================
   Module: Integrations (Pro) — connect, test, sync
   Direct connections where the service allows it (Airtable,
   Google Sheets, Stripe); the local Connector Helper handles
   services that block browser calls (Shopify, HubSpot, Notion).
   ============================================================ */

"use strict";

(function () {

  const HELPER_URL = "http://127.0.0.1:8787";

  /* ---------- HTTP helpers ---------- */

  async function directFetch(url, options) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(url, Object.assign({ signal: ctrl.signal }, options));
      const text = await res.text();
      let json = null;
      try { json = JSON.parse(text); } catch (e) { /* not JSON */ }
      return { status: res.status, ok: res.ok, json, text };
    } finally { clearTimeout(t); }
  }

  async function helperFetch(url, options) {
    options = options || {};
    const res = await fetch(HELPER_URL + "/proxy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, method: options.method || "GET", headers: options.headers || {}, body: options.body || null })
    });
    if (!res.ok) throw new Error("Helper error (" + res.status + ")");
    const wrapped = await res.json();
    let json = null;
    try { json = JSON.parse(wrapped.body); } catch (e) { /* not JSON */ }
    return { status: wrapped.status, ok: wrapped.status >= 200 && wrapped.status < 300, json, text: wrapped.body };
  }

  async function helperAlive() {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 2500);
      const res = await fetch(HELPER_URL + "/ping", { signal: ctrl.signal });
      clearTimeout(t);
      return res.ok;
    } catch (e) { return false; }
  }

  /* ---------- Import merge helpers (dedupe, source-tagged) ---------- */

  function upsertClients(rows, sourceName) {
    const S = App.store;
    let added = 0, skipped = 0;
    const defaultStatus = App.cfg.clientStatuses[0].id;
    rows.forEach(r => {
      if (!r.name || !String(r.name).trim()) { skipped++; return; }
      const dupe = S.data.clients.find(c =>
        (r.externalId && c.externalId === r.externalId) ||
        (r.email && c.email && c.email.toLowerCase() === String(r.email).toLowerCase()) ||
        c.name.toLowerCase() === String(r.name).toLowerCase());
      if (dupe) { skipped++; return; }
      S.data.clients.push({
        id: App.uid(), name: String(r.name).trim(),
        company: r.company || "", email: r.email || "", phone: r.phone || "",
        address: r.address || "", notes: r.notes || "",
        status: defaultStatus, source: sourceName,
        externalId: r.externalId || null,
        createdAt: Date.now(), updatedAt: Date.now()
      });
      added++;
    });
    if (added) {
      S.log("integrations", `Imported <b>${added}</b> ${App.T("client", true)} from <b>${App.esc(sourceName)}</b>`);
      S.save();
    }
    return { added, skipped };
  }

  function upsertPaidInvoices(rows, sourceName) {
    const S = App.store;
    let added = 0, skipped = 0;
    rows.forEach(r => {
      if (S.data.invoices.find(i => i.externalId === r.externalId)) { skipped++; return; }
      let clientId = null;
      if (r.customerName || r.customerEmail) {
        const { added: a } = upsertClients([{ name: r.customerName || r.customerEmail, email: r.customerEmail || "", externalId: r.customerExternalId }], sourceName);
        const c = S.data.clients.find(c =>
          (r.customerExternalId && c.externalId === r.customerExternalId) ||
          (r.customerEmail && c.email && c.email.toLowerCase() === String(r.customerEmail).toLowerCase()) ||
          (r.customerName && c.name.toLowerCase() === String(r.customerName).toLowerCase()));
        if (c) clientId = c.id;
      }
      S.data.settings.invoiceCounter += 1;
      S.data.invoices.push({
        id: App.uid(), number: r.number || String(S.data.settings.invoiceCounter),
        clientId, projectId: null,
        issueDate: r.date, dueDate: r.date,
        status: r.paid === false ? "sent" : "paid", paidDate: r.paid === false ? null : r.date,
        taxRate: 0,
        items: [{ desc: r.desc || (sourceName + " order"), qty: 1, rate: r.amount }],
        notes: "Imported from " + sourceName,
        externalId: r.externalId,
        createdAt: Date.now(), updatedAt: Date.now()
      });
      added++;
    });
    if (added) {
      S.log("money", `Imported <b>${added}</b> orders from <b>${App.esc(sourceName)}</b>`);
      S.save();
    }
    return { added, skipped };
  }

  /* ---------- Provider registry ---------- */

  const PROVIDERS = [
    {
      id: "webhooks", name: "Zapier / Make (webhooks)", color: "#ff4f00", initials: "⚡",
      desc: "When something happens here — new " + App.T("client") + ", invoice paid, " + App.T("quote") + " accepted, " + App.T("project") + " completed — ping a webhook and connect to 6,000+ apps.",
      needsHelper: false, guide: "zapier.html",
      fields: [
        { key: "url", label: "Webhook URL", placeholder: "https://hooks.zapier.com/hooks/catch/…", hint: "From a Zapier “Catch Hook” trigger or a Make “Custom webhook”" }
      ],
      async test(cfg) {
        try {
          await fetch(cfg.url, {
            method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ event: "test", data: { hello: "from " + App.cfg.productName }, sentAt: new Date().toISOString() })
          });
          return { ok: true, msg: "Test event sent — check your Zap/scenario's history" };
        } catch (e) {
          return { ok: false, msg: "Couldn't reach that URL" };
        }
      }
    },

    {
      id: "gsheets", name: "Google Sheets", color: "#188038", initials: "GS",
      desc: "Pull rows from any spreadsheet straight into your " + App.T("client") + " list.",
      needsHelper: false, guide: "google-sheets.html",
      fields: [
        { key: "apiKey", label: "Google API key", placeholder: "AIza…", type: "password" },
        { key: "sheetId", label: "Spreadsheet ID", placeholder: "From the sheet's URL", hint: "docs.google.com/spreadsheets/d/<b>THIS-PART</b>/edit" },
        { key: "range", label: "Sheet name or range", placeholder: "Sheet1", value: "Sheet1" }
      ],
      async test(cfg) {
        const r = await directFetch(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(cfg.sheetId)}/values/${encodeURIComponent(cfg.range || "Sheet1")}?key=${encodeURIComponent(cfg.apiKey)}`);
        if (r.ok) return { ok: true, msg: `Connected — found ${((r.json && r.json.values) || []).length} rows` };
        return { ok: false, msg: (r.json && r.json.error && r.json.error.message) || "Could not reach that sheet (check API key, ID, and that the sheet is shared as 'Anyone with the link')" };
      },
      actions: [{
        label: "Import rows as " + App.T("client", true),
        async run(cfg) {
          const r = await directFetch(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(cfg.sheetId)}/values/${encodeURIComponent(cfg.range || "Sheet1")}?key=${encodeURIComponent(cfg.apiKey)}`);
          if (!r.ok) throw new Error("Sheet fetch failed");
          const values = (r.json && r.json.values) || [];
          if (values.length < 2) throw new Error("Sheet needs a header row plus at least one data row");
          const header = values[0].map(h => String(h).toLowerCase());
          const col = (names) => header.findIndex(h => names.some(n => h.includes(n)));
          const iName = col(["name"]), iEmail = col(["mail"]), iPhone = col(["phone", "mobile", "tel"]),
            iCompany = col(["company", "business"]), iAddress = col(["address"]), iNotes = col(["note"]);
          if (iName < 0) throw new Error("Couldn't find a 'Name' column in the header row");
          const rows = values.slice(1).map(v => ({
            name: v[iName], email: iEmail >= 0 ? v[iEmail] : "", phone: iPhone >= 0 ? v[iPhone] : "",
            company: iCompany >= 0 ? v[iCompany] : "", address: iAddress >= 0 ? v[iAddress] : "", notes: iNotes >= 0 ? v[iNotes] : ""
          }));
          const res = upsertClients(rows, "Google Sheets");
          return `Imported ${res.added} new ${App.T("client", true)} (${res.skipped} already existed or were blank)`;
        }
      }]
    },

    {
      id: "airtable", name: "Airtable", color: "#f7b500", initials: "At",
      desc: "Sync records from an Airtable base into your dashboard.",
      needsHelper: false, guide: "airtable.html",
      fields: [
        { key: "token", label: "Personal access token", placeholder: "pat…", type: "password" },
        { key: "baseId", label: "Base ID", placeholder: "app…", hint: "From airtable.com/api — pick your base" },
        { key: "table", label: "Table name", placeholder: "e.g. Contacts" }
      ],
      async test(cfg) {
        const r = await directFetch(`https://api.airtable.com/v0/${encodeURIComponent(cfg.baseId)}/${encodeURIComponent(cfg.table)}?maxRecords=1`,
          { headers: { Authorization: "Bearer " + cfg.token } });
        if (r.ok) return { ok: true, msg: "Connected to “" + cfg.table + "”" };
        return { ok: false, msg: (r.json && r.json.error && (r.json.error.message || r.json.error)) || "Check your token, base ID, and table name" };
      },
      actions: [{
        label: "Import records as " + App.T("client", true),
        async run(cfg) {
          let offset = null, all = [];
          for (let page = 0; page < 10; page++) {
            const url = `https://api.airtable.com/v0/${encodeURIComponent(cfg.baseId)}/${encodeURIComponent(cfg.table)}?pageSize=100` + (offset ? "&offset=" + encodeURIComponent(offset) : "");
            const r = await directFetch(url, { headers: { Authorization: "Bearer " + cfg.token } });
            if (!r.ok) throw new Error("Airtable fetch failed");
            all = all.concat(r.json.records || []);
            offset = r.json.offset;
            if (!offset) break;
          }
          const pick = (f, names) => {
            const k = Object.keys(f).find(k => names.some(n => k.toLowerCase().includes(n)));
            return k ? f[k] : "";
          };
          const rows = all.map(rec => ({
            externalId: "airtable:" + rec.id,
            name: pick(rec.fields, ["name"]) || pick(rec.fields, ["title"]),
            email: pick(rec.fields, ["mail"]), phone: pick(rec.fields, ["phone", "mobile"]),
            company: pick(rec.fields, ["company", "business"]), notes: pick(rec.fields, ["note"])
          }));
          const res = upsertClients(rows, "Airtable");
          return `Imported ${res.added} new ${App.T("client", true)} (${res.skipped} skipped as duplicates/blank)`;
        }
      }]
    },

    {
      id: "stripe", name: "Stripe", color: "#635bff", initials: "S",
      desc: "See your Stripe payments here — imported as paid invoices.",
      needsHelper: false, guide: "stripe.html",
      fields: [
        { key: "key", label: "Restricted API key (read-only)", placeholder: "rk_live_…", type: "password", hint: "Make a <b>restricted</b> key with read-only access — never your secret key" }
      ],
      async test(cfg) {
        const r = await directFetch("https://api.stripe.com/v1/charges?limit=1", { headers: { Authorization: "Bearer " + cfg.key } });
        if (r.ok) return { ok: true, msg: "Connected to Stripe" };
        return { ok: false, msg: (r.json && r.json.error && r.json.error.message) || "Stripe rejected that key" };
      },
      actions: [{
        label: "Import recent payments",
        async run(cfg) {
          const r = await directFetch("https://api.stripe.com/v1/charges?limit=100", { headers: { Authorization: "Bearer " + cfg.key } });
          if (!r.ok) throw new Error("Stripe fetch failed");
          const rows = (r.json.data || []).filter(ch => ch.paid && !ch.refunded).map(ch => ({
            externalId: "stripe:" + ch.id,
            number: "ST-" + ch.id.slice(-6).toUpperCase(),
            date: new Date(ch.created * 1000).toISOString().slice(0, 10),
            amount: ch.amount / 100,
            desc: ch.description || "Stripe payment",
            customerName: (ch.billing_details && ch.billing_details.name) || "",
            customerEmail: (ch.billing_details && ch.billing_details.email) || (ch.receipt_email || ""),
            paid: true
          }));
          const res = upsertPaidInvoices(rows, "Stripe");
          return `Imported ${res.added} payments (${res.skipped} already imported)`;
        }
      }]
    },

    {
      id: "shopify", name: "Shopify", color: "#5e8e3e", initials: "Sh",
      desc: "Bring your store's orders and customers into the dashboard.",

      fields: [
        { key: "shop", label: "Store domain", placeholder: "your-store.myshopify.com" },

      ],
      _base(cfg) { return "https://" + cfg.shop.replace(/^https?:\/\//, "").replace(/\/.*$/, "") + "/admin/api/2024-01"; },
      async test(cfg) {
        const r = await helperFetch(this._base(cfg) + "/shop.json", { headers: { "X-Shopify-Access-Token": cfg.token } });
        if (r.ok) return { ok: true, msg: "Connected to " + ((r.json.shop && r.json.shop.name) || cfg.shop) };
        return { ok: false, msg: r.status === 401 || r.status === 403 ? "Shopify rejected that token" : "Couldn't reach that store — check the domain" };
      },
      actions: [
        {
          label: "Import customers as " + App.T("client", true),
          async run(cfg) {
            const r = await helperFetch(this._base(cfg) + "/customers.json?limit=250", { headers: { "X-Shopify-Access-Token": cfg.token } });
            if (!r.ok) throw new Error("Shopify fetch failed (does your token have read_customers scope?)");
            const rows = (r.json.customers || []).map(c => ({
              externalId: "shopify:" + c.id,
              name: ((c.first_name || "") + " " + (c.last_name || "")).trim() || c.email,
              email: c.email || "", phone: c.phone || ""
            }));
            const res = upsertClients(rows, "Shopify");
            return `Imported ${res.added} new ${App.T("client", true)} (${res.skipped} skipped)`;
          }
        },
        {

  /* ---------- Connect modal ---------- */

  function connectModal(p, content) {
    if (App.cfg.demo) return App.toast("Connections are unlocked in the full version", "error");
    const S = App.store;
    const saved = S.data.integrations[p.id] || {};
    const body = document.createElement("div");
    body.innerHTML = `
      <div class="form-grid">${p.fields.map(f => `
        <div class="field full">
          <label>${App.esc(f.label)}</label>
          <input data-f="${f.key}" type="${f.type || "text"}" value="${App.esc(saved[f.key] || f.value || "")}" placeholder="${App.esc(f.placeholder || "")}" autocomplete="off" spellcheck="false">
          ${f.hint ? `<div class="hint">${f.hint}</div>` : ""}
        </div>`).join("")}</div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
        <button class="btn" id="ciTest">Test connection</button>
        <div class="conn-test" id="ciResult"></div>
      </div>
      <p class="muted" style="font-size:11.5px;margin-top:14px;line-height:1.5">
        Keys are stored only on this computer, in this browser. Follow the
        <a href="Guides/${p.guide}" target="_blank" style="color:var(--accent)">setup guide</a> to create one with the least access needed.</p>`;

    const getCfg = () => {
      const cfg = {};
      body.querySelectorAll("[data-f]").forEach(el => cfg[el.dataset.f] = el.value.trim());
      return cfg;
    };

    body.querySelector("#ciTest").onclick = async () => {
      const result = body.querySelector("#ciResult");
      const cfg = getCfg();
      if (p.fields.some(f => !cfg[f.key])) { result.innerHTML = `<span style="color:var(--red)">Fill in every field first</span>`; return; }
      result.innerHTML = `<span class="spinner"></span> Testing…`;
      if (p.needsHelper && !(await helperAlive())) {
        result.innerHTML = `<span style="color:var(--amber)">Start the Connector Helper first (see guide)</span>`;
        return;
      }
      try {
        const res = await p.test(cfg);
        result.innerHTML = res.ok
          ? `<span style="color:var(--green)">✓ ${App.esc(res.msg)}</span>`
          : `<span style="color:var(--red)">✗ ${App.esc(res.msg)}</span>`;
      } catch (e) {
        result.innerHTML = `<span style="color:var(--red)">✗ ${App.esc(p.needsHelper ? "Connection failed — is the helper running?" : "Connection failed: " + e.message)}</span>`;
      }
    };

    App.modal({
      title: "Connect " + p.name,
      body, wide: true,
      onOpen(overlay, close) {
        const foot = document.createElement("div");
        foot.style.cssText = "display:flex;justify-content:flex-end;gap:9px;padding:0 22px 20px";
        foot.innerHTML = `${S.data.integrations[p.id] ? '<button class="btn btn-danger" style="margin-right:auto">Disconnect</button>' : ""}
          <button class="btn">Cancel</button><button class="btn btn-primary">Save connection</button>`;
        overlay.querySelector(".modal").appendChild(foot);
        const btns = foot.querySelectorAll("button");
        if (S.data.integrations[p.id]) {
          btns[0].onclick = () => {
            delete S.data.integrations[p.id];
            S.save(); close(); App.toast(p.name + " disconnected"); App.render();
          };
        }
        btns[btns.length - 2].onclick = close;
        btns[btns.length - 1].onclick = () => {
          const cfg = getCfg();
          if (p.fields.some(f => !cfg[f.key])) return App.toast("Fill in every field first", "error");
          cfg.connectedAt = Date.now();
          cfg.lastSync = (S.data.integrations[p.id] || {}).lastSync || null;
          S.data.integrations[p.id] = cfg;
          S.save(); close();
          App.toast(p.name + " connected");
          App.render();
        };
      }
    });
  }

  /* ---------- Sync actions ---------- */

  function runActions(p, content) {
    const S = App.store;
    const cfg = S.data.integrations[p.id];
    if (!cfg) return;

    const body = document.createElement("div");
    body.innerHTML = p.actions.map((a, i) => `
      <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
        <div style="flex:1;font-size:13.5px;font-weight:600">${App.esc(a.label)}</div>
        <button class="btn btn-sm btn-primary" data-run="${i}">Run</button>
      </div>
      <div class="conn-test" data-result="${i}" style="padding:6px 0"></div>`).join("");

    App.modal({
      title: p.name + " — sync",
      body,
      onOpen(overlay) {
        body.querySelectorAll("[data-run]").forEach(btn => {
          btn.onclick = async () => {
            const i = Number(btn.dataset.run);
            const result = body.querySelector(`[data-result="${i}"]`);
            btn.disabled = true;
            result.innerHTML = `<span class="spinner"></span> Syncing…`;
            if (p.needsHelper && !(await helperAlive())) {
              result.innerHTML = `<span style="color:var(--amber)">Start the Connector Helper first, then try again</span>`;
              btn.disabled = false;
              return;
            }
            try {
              const msg = await p.actions[i].run.call(p, cfg);
              cfg.lastSync = Date.now();
              S.save();
              result.innerHTML = `<span style="color:var(--green)">✓ ${App.esc(msg)}</span>`;
              App.toast("Sync complete");
            } catch (e) {
              result.innerHTML = `<span style="color:var(--red)">✗ ${App.esc(e.message)}</span>`;
            }
            btn.disabled = false;
          };
        });
      }
    });
  }

})();

      });
      App.store.all("notes").forEach(n => {
        if (((n.title || "") + " " + (n.body || "")).toLowerCase().includes(q))

  /* ---------- Recurring invoices ---------- */

  function processRecurring() {
    const S = App.store;
    const today = App.todayISO();
    let created = 0;
    S.all("invoices").filter(i => i.recurring && i.recurringNext && i.recurringNext <= today).forEach(tpl => {
      let guard = 0;
      while (tpl.recurringNext && tpl.recurringNext <= today && guard < 6) {
        S.data.settings.invoiceCounter += 1;
        const dueDelta = tpl.dueDate && tpl.issueDate
          ? Math.max(0, Math.round((new Date(tpl.dueDate) - new Date(tpl.issueDate)) / 86400000)) : 14;
        S.data.invoices.push({
          id: App.uid(), number: String(S.data.settings.invoiceCounter),
          clientId: tpl.clientId, projectId: tpl.projectId,
          issueDate: tpl.recurringNext, dueDate: App.addDaysISO(tpl.recurringNext, dueDelta),
          status: "draft", taxRate: tpl.taxRate || 0,
          items: JSON.parse(JSON.stringify(tpl.items || [])),
          notes: tpl.notes || "", recurring: "", recurringNext: null, fromRecurring: tpl.id,
          createdAt: Date.now(), updatedAt: Date.now()
        });
        created++;
        tpl.recurringNext = App.advanceRecurring(tpl.recurringNext, tpl.recurring);
        guard++;
      }
    });
    if (created) {
      S.log("invoices", `Drafted <b>${created}</b> recurring invoice${created === 1 ? "" : "s"} automatically`);
      S.save();
      setTimeout(() => App.toast(created + " recurring invoice" + (created === 1 ? "" : "s") + " drafted — review in Invoices"), 800);
    }
  }

    document.body.appendChild(overlay);
    document.body.appendChild(tip);
    let spotEl = null;

    function show() {
      if (spotEl) { spotEl.style.position = ""; spotEl.style.zIndex = ""; spotEl.style.pointerEvents = ""; }
      const step = steps[idx];
      spotEl = document.querySelector(step.sel);
      if (!spotEl) return done();
      spotEl.style.position = "relative";
      spotEl.style.zIndex = "301";
      spotEl.style.pointerEvents = "none";
      const r = spotEl.getBoundingClientRect();
      tip.innerHTML = `

      const top = Math.min(window.innerHeight - 170, Math.max(12, r.top - 10));

  /* ---------- Sample data (edition-aware) ---------- */

  App.loadSampleData = function () {
    const S = App.store;
    const sm = App.cfg.sample;
    const stages = App.cfg.projectStages;
    const statuses = App.cfg.clientStatuses;
    const today = App.todayISO();

    const firstNames = ["Sarah", "Mike", "Jennifer", "David", "Amanda", "Chris", "Lisa", "Tom", "Rachel", "Kevin", "Maria", "James"];
    const lastNames = ["Mitchell", "Torres", "Chen", "Brooks", "Patel", "Reed", "Nguyen", "Carter", "Kim", "Alvarez", "Foster", "Hayes"];

    const rnd = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

    const clients = [];
    for (let i = 0; i < 8; i++) {
      const name = firstNames[i] + " " + lastNames[i];
      const c = {
        id: App.uid(), name,
        company: sm.companies ? rnd(sm.companies) : "",
        email: name.toLowerCase().replace(" ", ".") + "@example.com",
        phone: "(555) " + rint(200, 999) + "-" + String(rint(1000, 9999)),
        status: statuses[Math.min(i % statuses.length, statuses.length - 1)].id,
        source: rnd(["Referral", "Website", "Google", "Social media", "Repeat"]),
        address: "", notes: "",
        createdAt: Date.now() - rint(5, 200) * 86400000, updatedAt: Date.now()
      };
      clients.push(c);
      S.data.clients.push(c);
    }

    const projects = [];
    sm.projects.forEach((pname, i) => {
      const c = clients[i % clients.length];
      const stage = stages[Math.min(i % stages.length, stages.length - 1)];
      const p = {
        id: App.uid(), name: pname, clientId: c.id, stage: stage.id,
        value: rint(sm.valueRange[0], sm.valueRange[1]),
        startDate: App.addDaysISO(today, -rint(5, 90)),
        dueDate: App.addDaysISO(today, rint(-5, 45)),
        description: "",
        createdAt: Date.now() - rint(5, 90) * 86400000, updatedAt: Date.now() - rint(0, 5) * 86400000
      };
      projects.push(p);
      S.data.projects.push(p);
    });

    // invoices across last 10 months so charts look alive
    for (let i = 0; i < 16; i++) {
      const p = rnd(projects);
      // first four are guaranteed paid in this month / last month so the
      // dashboard never opens on an empty revenue KPI
      const monthsBack = i < 2 ? 0 : i < 4 ? 1 : rint(0, 9);
      const d = new Date();
      d.setMonth(d.getMonth() - monthsBack);
      d.setDate(monthsBack === 0 ? rint(1, Math.max(1, new Date().getDate())) : rint(1, 26));
      const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      const status = i < 4 ? "paid" : monthsBack === 0 ? rnd(["sent", "paid", "sent"]) : rnd(["paid", "paid", "paid", "sent"]);
      const items = [];
      const nItems = rint(1, 3);
      for (let j = 0; j < nItems; j++) {
        const svc = rnd(sm.services);
        items.push({ desc: svc.desc, qty: svc.qty || 1, rate: rint(svc.rate[0], svc.rate[1]) });
      }
      S.data.settings.invoiceCounter += 1;
      S.data.invoices.push({
        id: App.uid(), number: String(S.data.settings.invoiceCounter),
        clientId: p.clientId, projectId: p.id,
        issueDate: iso, dueDate: App.addDaysISO(iso, 14),
        status, paidDate: status !== "paid" ? null : (i < 4 ? iso : App.addDaysISO(iso, rint(2, 18))),
        taxRate: 0, items, notes: "Thank you for your business!",
        createdAt: d.getTime(), updatedAt: d.getTime()
      });
    }

    // quotes: a lively mix so the win-rate and pipeline read well
    const qStatuses = ["sent", "accepted", "sent", "accepted", "declined", "draft"];
    for (let i = 0; i < 6; i++) {
      const p = projects[(i + 2) % projects.length];
      const issued = App.addDaysISO(today, -rint(2, 45));
      const items = [];
      for (let j = 0; j < rint(1, 3); j++) {
        const svc = rnd(sm.services);
        items.push({ desc: svc.desc, qty: svc.qty || 1, rate: rint(svc.rate[0], svc.rate[1]) });
      }
      S.data.settings.quoteCounter += 1;
      S.data.quotes.push({
        id: App.uid(), number: "Q-" + S.data.settings.quoteCounter,
        clientId: p.clientId, projectId: p.id,
        issueDate: issued, validUntil: App.addDaysISO(issued, 30),
        status: qStatuses[i], taxRate: 0, items,
        notes: "Thanks for the opportunity — we'd love to earn your business.",
        createdAt: Date.now() - rint(2, 45) * 86400000, updatedAt: Date.now()
      });
    }

    // a few tracked time entries
    for (let i = 0; i < 4; i++) {
      const p = projects[i % projects.length];
      const day = App.addDaysISO(today, -rint(0, 6));
      const start = new Date(day + "T09:30:00").getTime() + i * 3600000;
      S.data.timelogs.push({
        id: App.uid(), projectId: p.id, clientId: p.clientId,
        desc: rnd(["On-site work", "Prep & planning", "Client call", "Admin & follow-up"]),
        startTs: start, endTs: start + rint(1, 4) * 1800000, billed: i === 0,
        createdAt: Date.now(), updatedAt: Date.now()
      });
    }

    sm.tasks.forEach((title, i) => {
      const p = projects[i % projects.length];
      S.data.tasks.push({
        id: App.uid(), title, clientId: p.clientId, projectId: p.id,
        due: App.addDaysISO(today, rint(-2, 12)),
        priority: rnd(["normal", "normal", "high", "low"]), done: i % 4 === 3,
        notes: "", createdAt: Date.now(), updatedAt: Date.now()
      });
    });

    sm.events.forEach((title, i) => {
      const c = clients[i % clients.length];
      S.data.events.push({
        id: App.uid(), title, clientId: c.id,
        date: App.addDaysISO(today, rint(0, 14)),
        time: rnd(["09:00", "10:30", "13:00", "14:30", "16:00"]),
        location: sm.locations ? rnd(sm.locations) : "",
        notes: "", createdAt: Date.now(), updatedAt: Date.now()
      });
    });

    S.data.notes.push({
      id: App.uid(), title: "Welcome — how notes work",
      body: "Notes autosave as you type.<br><br>Use the dropdowns above to <b>link a note</b> to a " + App.T("client") + " or " + App.T("project") + " — it will show up on their page automatically.",
      createdAt: Date.now(), updatedAt: Date.now()
    });

    S.log("sparkle", "Loaded sample data");
    S.save();
  };

  /* ---------- Boot ---------- */

  App.store.load();

  // Demo mode (?demo=1 or a demo build): skip onboarding, seed sample data.
  const boot_params = new URLSearchParams(location.search);
  if ((boot_params.get("demo") === "1" || App.cfg.demo) && !App.store.data.settings.onboarded) {
    const s = App.store.data.settings;
    s.onboarded = true;
    s.toured = true;
    s.lastBackupNudge = Date.now(); // no nudge in demos/screenshots
    s.businessName = App.cfg.sampleBusinessName;
    App.loadSampleData();
  }

  App.applyBranding();
  buildNav();
  initTheme();
  initSearch();
  initQuickAdd();
  updateNavCounts();
  updateTimerChip();
  applyDemoMode();
  processRecurring();
  if (!location.hash) location.hash = "#/dashboard";
  App.render();
  maybeOnboard();
  maybeTour();
  maybeBackupNudge();

})();

</script>
</body>
</html>
